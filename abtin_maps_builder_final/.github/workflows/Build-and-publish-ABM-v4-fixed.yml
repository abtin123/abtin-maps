name: Build and Publish ABM v4

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      country:
        description: "Codes from countries.json, comma separated (e.g. AM,IR), all, or none (no build, only rebuild manifest from the release)"
        required: true
        default: "all"
      publish:
        description: "Upload to the release (false = build only)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: abm-release
  cancel-in-progress: false

env:
  RELEASE_TAG: maps-v4
  MAX_ASSET_BYTES: "1932735283"   # ~1.8 GiB, larger archives are split into parts

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          WANT: ${{ github.event_name == 'schedule' && (vars.WEEKLY_COUNTRIES || 'all') || inputs.country }}
        run: |
          python3 - <<'PY'
          import json, os
          countries = json.load(open('countries.json', encoding='utf-8'))
          want = os.environ['WANT'].replace(' ', '').upper()
          codes = [] if want == 'NONE' else list(countries) if want in ('', 'ALL') else [c for c in want.split(',') if c]
          unknown = [c for c in codes if c not in countries]
          if unknown:
              raise SystemExit(f'Unknown code(s) not in countries.json: {unknown}')
          include = [{'code': c, 'pbf_url': countries[c]['pbf_url'],
                      'regions_config': countries[c].get('regions_config', '')} for c in codes]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'include': include}) + '\n')
          print('Building:', ', '.join(codes))
          PY

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      CODE: ${{ matrix.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Fetch previous manifest
        run: |
          mkdir -p prev
          gh release download "$RELEASE_TAG" --pattern manifest.json --dir prev --clobber || true

      - name: Download OSM extract
        run: curl -fL --retry 5 --retry-delay 15 -o input.osm.pbf "${{ matrix.pbf_url }}"

      - name: Check source and skip unchanged rebuilds
        id: source_check
        env:
          PBF_URL: ${{ matrix.pbf_url }}
        run: |
          mkdir -p dist
          curl -fsSI --retry 5 --retry-delay 5 "$PBF_URL" > source.headers || true
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          code=os.environ['CODE']
          p=Path('input.osm.pbf')
          h=hashlib.sha256()
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024), b''): h.update(b)
          digest=h.hexdigest()
          size=p.stat().st_size
          headers={}
          for line in Path('source.headers').read_text(errors='ignore').splitlines():
              if ':' in line:
                  k,v=line.split(':',1); headers[k.strip().lower()]=v.strip()
          last_modified=headers.get('last-modified','')
          etag=headers.get('etag','')
          prev={}
          mf=Path('prev/manifest.json')
          if mf.exists():
              try:
                  m=json.loads(mf.read_text(encoding='utf-8'))
                  entries=m.get('countries',[])
                  prev=next((x for x in entries if x.get('code')==code), None)
                  if prev is None:
                      prev=next((x for x in entries if str(x.get('country_code','')).upper()==code), {})
              except Exception:
                  prev={}
          old_source=prev.get('source') or {}
          old=(old_source.get('pbf_sha256') or '')
          old_lm=(old_source.get('pbf_last_modified') or '')
          old_etag=(old_source.get('pbf_etag') or '')
          # Prefer stable HTTP validators when available. Fall back to the
          # content hash for providers that do not expose them.
          if etag and old_etag:
              changed = etag != old_etag
          elif last_modified and old_lm:
              changed = last_modified != old_lm
          else:
              changed = digest != old or not old
          meta={
              'pbf_sha256': digest,
              'pbf_size': size,
              'pbf_last_modified': last_modified,
              'pbf_etag': etag,
              'source_checked_at': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
          }
          Path(f'dist/{code}.source.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('source_changed').write_text('1' if changed else '0')
          print(f'{code}: source sha256={digest}; previous={old or "none"}; changed={changed}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'changed={str(changed).lower()}\n')
          PY

      - name: Build ABM
        if: steps.source_check.outputs.changed == 'true'
        run: |
          REGIONS="${{ matrix.regions_config }}"
          if [ -n "$REGIONS" ]; then
            [ -f "$REGIONS" ] || REGIONS="sample/$REGIONS"
            python build_abm.py input.osm.pbf --country "$CODE" --regions "$REGIONS" --output dist/
          else
            python build_abm.py input.osm.pbf --country "$CODE" --output "dist/$CODE.abm"
          fi
          ls -lh dist

      - name: Patch against previous release and split if needed
        run: |
          for abm in dist/*.abm; do
            python packaging/prepare_release.py "$(basename "$abm" .abm)" \
              --dist dist --previous-manifest prev/manifest.json \
              --release-tag "$RELEASE_TAG" --max-asset-bytes "$MAX_ASSET_BYTES"
          done

      - name: Build manifest fragment and stage files
        if: steps.source_check.outputs.changed == 'true'
        run: |
          python packaging/build_release_manifest.py dist \
            --release-tag "$RELEASE_TAG" --names countries.json \
            --stage-dir stage -o fragment/manifest.json

      - name: Remove source metadata helper and OSM input
        run: rm -f dist/*.source.json input.osm.pbf source.headers

      - name: Upload files
        if: steps.source_check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: abm-${{ matrix.code }}
          path: stage/
          compression-level: 0
          retention-days: 3

      - name: Upload manifest fragment
        if: steps.source_check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frag-${{ matrix.code }}
          path: fragment/manifest.json
          retention-days: 3

  publish:
    needs: [discover, build]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DO_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the release (manifest + asset list)
        run: |
          mkdir -p prev
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern manifest.json --dir prev --clobber || true
            gh release view "$RELEASE_TAG" --json assets > assets.json
          else
            echo '{"assets":[]}' > assets.json
          fi

      - name: Download manifest fragments of this run
        run: |
          mkdir -p frags
          gh run download "$GITHUB_RUN_ID" --pattern 'frag-*' --dir frags || echo "No successful builds"
          find frags -name manifest.json | sort

      - name: Download release ABMs that are missing from / broken in the manifest
        run: |
          FRAGS=()
          while IFS= read -r f; do FRAGS+=(--current-manifest "$f"); done < <(find frags -name manifest.json | sort)

          python3 packaging/build_release_manifest.py --list-incomplete \
            --previous-manifest prev/manifest.json --release-assets-json assets.json \
            "${FRAGS[@]}" > incomplete.txt
          echo "Need inspection: $(tr '\n' ' ' < incomplete.txt)"

          mkdir -p repair
          while IFS= read -r code; do
            [ -n "$code" ] && { gh release download "$RELEASE_TAG" --pattern "$code.abm" --dir repair --clobber || echo "::warning::cannot download $code.abm"; }
          done < incomplete.txt
          ls -lh repair

      - name: Build final manifest
        run: |
          FRAGS=()
          while IFS= read -r f; do FRAGS+=(--current-manifest "$f"); done < <(find frags -name manifest.json | sort)

          python3 packaging/build_release_manifest.py \
            --release-tag "$RELEASE_TAG" --names countries.json \
            --previous-manifest prev/manifest.json \
            --release-assets-json assets.json --asset-dir repair \
            "${FRAGS[@]}" \
            --stale-out stale.txt -o final/manifest.json
          python3 packaging/build_release_manifest.py --validate final/manifest.json \
            --previous-manifest prev/manifest.json
          rm -rf repair

      - name: Publish
        if: ${{ env.DO_PUBLISH == 'true' }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "ABM v4 offline map data" --notes "ABM v4 offline map data"

          # 1) new/updated data files, one country at a time (keeps runner disk small)
          for d in $(find frags -name manifest.json -printf '%h\n' | sort); do
            code=$(basename "$d"); code=${code#frag-}
            mkdir -p "stage/$code"
            gh run download "$GITHUB_RUN_ID" --name "abm-$code" --dir "stage/$code"
            for f in stage/$code/*; do
              for try in 1 2 3; do gh release upload "$RELEASE_TAG" "$f" --clobber && break || sleep 20; done
            done
            rm -rf "stage/$code"
          done

          # 2) manifest last, so the app never sees entries whose files are not there yet
          gh release upload "$RELEASE_TAG" final/manifest.json --clobber

          # 3) remove superseded parts / patches of rebuilt countries
          while IFS= read -r name; do
            [ -n "$name" ] && gh release delete-asset "$RELEASE_TAG" "$name" --yes || true
          done < stale.txt

      - name: Summary
        run: |
          {
            echo "### Release manifest"
            echo '```'
            python3 -c "import json;m=json.load(open('final/manifest.json'));[print(f\"{c['code']:8} {c['name_en']:22} {c['total_size']:>12} B  {'patch' if c.get('patch') else '-'}\") for c in m['countries']]"
            echo '```'
            echo "Published: $DO_PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"
