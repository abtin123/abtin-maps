schema_name: Abtin Basemap
schema_description: Offline vector basemap with roads, place labels, buildings, boundaries, and lightweight POIs. Routing/search remain in the ABM tail.
attribution: © OpenStreetMap contributors, ODbL 1.0
version: 1.3.0
is_overlay: false
args:
  osm_path:
    description: Absolute OSM PBF input path.
    default: /data/input.osm.pbf
  minzoom: 2
  # Planetiler 0.10.2 hard-caps tile-pyramid maxzoom at 16. The app overzooms
  # these z16 tiles through z20.
  maxzoom: 16
  force: true
sources:
  osm:
    type: osm
    local_path: '${ args.osm_path }'
layers:
  - id: land
    features:
      - source: osm
        geometry: polygon
        min_zoom:
          default_value: 10
          overrides:
            2:
              landuse: [forest, farmland]
              natural: [wood, scrub]
            5:
              landuse: [forest, farmland]
              natural: [wood, scrub]
            7:
              landuse: [residential, industrial, commercial]
        include_when:
          landuse: [allotments, cemetery, commercial, farmland, farmyard, forest, grass, industrial, meadow, orchard, residential, retail, vineyard]
          natural: [beach, grassland, heath, sand, scrub, wood]
        attributes:
          - key: class
            type: match_value
  - id: water
    features:
      - source: osm
        geometry: polygon
        min_zoom:
          default_value: 9
          overrides:
            2:
              natural: water
              waterway: riverbank
              landuse: reservoir
            4:
              natural: water
              waterway: riverbank
              landuse: reservoir
        include_when:
          natural: water
          waterway: [riverbank, dock]
          landuse: [reservoir, basin]
        attributes:
          - key: class
            type: match_value
      - source: osm
        geometry: line
        min_zoom:
          default_value: 10
          overrides:
            6:
              waterway: river
        include_when:
          waterway: [river, canal, stream]
        attributes:
          - key: class
            type: match_value
  - id: places
    features:
      - source: osm
        geometry: point
        min_zoom:
          default_value: 10
          overrides:
            5:
              place: [city, town]
              capital: [yes, '4']
            6:
              place: city
            7:
              place: town
            8:
              place: [village, suburb, quarter, neighbourhood]
        include_when:
          place: [city, town, village, suburb, quarter, neighbourhood, hamlet, locality]
        exclude_when:
          name: ''
        attributes:
          - key: class
            type: match_value
          - key: name
            tag_value: name
          - key: name_fa
            tag_value: name:fa
          - key: population
            type: integer
            include_when:
              population: __any__
  - id: pois
    features:
      - source: osm
        geometry: point
        min_zoom: 12
        include_when:
          amenity: __any__
          shop: __any__
          tourism: __any__
          leisure: __any__
          craft: __any__
          office: __any__
          man_made: [tower, communications_tower, water_tower]
          highway: [bus_stop, motorway_junction]
          railway: [station, halt, tram_stop]
          aeroway: [aerodrome, helipad]
        exclude_when:
          name: ''
        attributes:
          - key: class
            value:
              - if:
                  amenity: fuel
                value: fuel
              - if:
                  amenity: [parking, hospital, clinic, pharmacy, police, school, college, university, restaurant, fast_food, cafe, bank, atm, hotel, motel, hostel, supermarket, convenience, place_of_worship, toilets, bus_station]
                value: '${match_value}'
              - if:
                  amenity: [bus_stop, ferry_terminal]
                value: bus_stop
              - if:
                  railway: [station, halt, tram_stop]
                value: station
              - if:
                  aeroway: [aerodrome, helipad]
                value: aerodrome
              - if:
                  tourism: [attraction, museum, hotel, motel, hostel]
                value: attraction
              - if:
                  leisure: [park, garden, pitch]
                value: '${match_value}'
              - else: poi
          - key: name
            tag_value: name
          - key: name_fa
            tag_value: name:fa
  - id: buildings
    features:
      - source: osm
        geometry: polygon
        min_zoom: 14
        include_when:
          building: __any__
        exclude_when:
          building: [no, roof]
  - id: boundaries
    features:
      - source: osm
        geometry: line
        min_zoom:
          default_value: 7
          overrides:
            2:
              admin_level: ['2']
            3:
              admin_level: '2'
        include_when:
          __all__:
            - boundary: administrative
              admin_level: ['2', '4']
        attributes:
          - key: admin_level
            type: integer
  - id: roads
    features:
      - source: osm
        geometry: line
        min_size: 0
        min_zoom:
          default_value: 13
          overrides:
            5:
              highway: [motorway, motorway_link]
            6:
              highway: [trunk, trunk_link]
            8:
              highway: [primary, primary_link]
            9:
              highway: [secondary, secondary_link]
            10:
              highway: [tertiary, tertiary_link]
            12:
              highway: [unclassified, residential]
        include_when:
          highway: [motorway, motorway_link, trunk, trunk_link, primary, primary_link, secondary, secondary_link, tertiary, tertiary_link, unclassified, residential, living_street, service, track]
        attributes:
          - key: class
            value: '${ match_value.replace("_link", "") }'
          - key: name
            tag_value: name
          - key: name_fa
            tag_value: name:fa
          - key: link
            value: true
            include_when:
              highway: [motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]
            else: false
          - key: bridge
            value: true
            include_when:
              bridge: __any__
            else: false
          - key: tunnel
            value: true
            include_when:
              tunnel: __any__
            else: false
