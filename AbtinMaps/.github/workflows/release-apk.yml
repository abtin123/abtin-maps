name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Package release APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/AbtinMaps-release.apk
          sha256sum release/AbtinMaps-release.apk > release/SHA256SUMS.txt
          cd release && zip -9 AbtinMaps-release-apk.zip AbtinMaps-release.apk SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AbtinMaps-release-apk
          path: release/AbtinMaps-release-apk.zip
