name: L10n Parity Gate

# Run on every PR touching locale assets; fails the build if any locale is
# missing keys, has extra keys, or has a placeholder that does not match fa.

on:
  pull_request:
    paths:
      - 'assets/local/**'
      - 'lib/core/localization/app_localizations.dart'
      - 'tool/l10n/parity.py'

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Regenerate and validate
        run: |
          python tool/l10n/parity.py
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          LOCAL = Path("assets/local")
          locales = {p.stem: json.loads(p.read_text(encoding="utf-8"))
                     for p in LOCAL.glob("*.json") if p.name != "manifest.json"}
          union = set()
          for d in locales.values(): union |= set(d.keys())
          ph = re.compile(r"\{[a-z_][a-z0-9_]*\}")
          issues = []
          for code, d in locales.items():
              miss = union - set(d.keys()); extra = set(d.keys()) - union
              if miss or extra: issues.append((code, "missing/extra"))
              for k in union:
                  fph = set(ph.findall(locales["fa"].get(k,"")))
                  if fph and set(ph.findall(d.get(k,""))) != fph:
                      issues.append((code, k))
          if issues:
              for it in issues[:50]: print("ISSUE", it)
              sys.exit(1)
          print(f"PARITY OK: {len(locales)} locales x {len(union)} keys")
          PY
