services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abtin
      POSTGRES_USER: abtin
      POSTGRES_PASSWORD: abtin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abtin -d abtin"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    working_dir: /app
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo_data --password $$SEED_DEFAULT_PASSWORD && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      USE_SQLITE: "0"
      DB_HOST: db
      DB_NAME: abtin
      DB_USER: abtin
      DB_PASSWORD: abtin
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SEED_DEFAULT_PASSWORD: Demo-Strong-Password-2026!
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/schema/', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  celery:
    build: ./backend
    command: celery -A config worker -l warning
    working_dir: /app
    volumes: [./backend:/app]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      USE_SQLITE: "0"
      DB_HOST: db
      DB_NAME: abtin
      DB_USER: abtin
      DB_PASSWORD: abtin
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    command: celery -A config beat -l warning
    working_dir: /app
    volumes: [./backend:/app]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      USE_SQLITE: "0"
      DB_HOST: db
      DB_NAME: abtin
      DB_USER: abtin
      DB_PASSWORD: abtin
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
