name: Build and publish incremental map updates

# ۱. چک و اپدیت هفتگی: هر دوشنبه ساعت ۲ بامداد UTC خودکار اجرا می‌شود.
#    برای هر کشور، دیتای OSM تازه دانلود و با نسخه‌ی منتشرشده‌ی قبلی مقایسه
#    می‌شود؛ فقط کشورهایی که واقعاً تغییر کرده‌اند از نو ساخته می‌شوند
#    (ویژگی ۵) و برای بقیه فقط patch افزایشی منتشر می‌شود (ویژگی ۴).
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      country:
        description: 'کد کشور برای ساخت، یا "all" برای همه'
        required: false
        default: 'all'
      exclude:
        description: 'کدهای کشور که باید از "all" کنار گذاشته شوند (با کاما)، مثلا IR'
        required: false
        default: ''
      force_rebuild:
        description: 'حتی اگر داده‌ی منبع تغییر نکرده، از نو بساز'
        required: false
        type: boolean
        default: false
      publish:
        description: 'نتیجه در release نهایی منتشر شود'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_TAG: maps-v4
  PYTHONUNBUFFERED: '1'

jobs:
  # ------------------------------------------------------------------
  # کشف کشورها: "country=all" + "exclude=IR" => همه به‌جز ایران (ویژگی ۳)
  # "country=all" بدون exclude => همه‌ی کشورها (ویژگی ۲)
  # "country=IR" => فقط ایران
  # ------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          REQUESTED_COUNTRY: ${{ inputs.country || 'all' }}
          EXCLUDE_COUNTRIES: ${{ inputs.exclude || '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          data = json.load(open('countries.json', encoding='utf-8'))
          requested = os.environ.get('REQUESTED_COUNTRY', 'all').strip().upper()
          exclude = {c.strip().upper() for c in os.environ.get('EXCLUDE_COUNTRIES', '').split(',') if c.strip()}

          unknown_exclude = sorted(c for c in exclude if c not in data)
          if unknown_exclude:
              raise SystemExit(f'Unknown country code(s) in exclude: {unknown_exclude}')

          if requested in ('', 'ALL'):
              codes = sorted(c for c in data if c not in exclude)
          else:
              if requested not in data:
                  raise SystemExit(f'Unknown country code: {requested}')
              codes = [requested]  # exclude is only meaningful together with "all"

          if not codes:
              raise SystemExit('No countries left to build after applying the exclude list.')

          print('matrix=' + json.dumps({'country': codes}, separators=(',', ':')))
          PY

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install builder dependencies
        run: pip install -r requirements.txt

      - name: Download current OSM extract
        env:
          CODE: ${{ matrix.country }}
        run: |
          URL=$(python3 -c "import json;print(json.load(open('countries.json',encoding='utf-8'))['$CODE']['pbf_url'])")
          echo "Downloading $URL"
          curl -L --fail --retry 3 --retry-delay 5 "$URL" -o "${CODE}.osm.pbf"
          SIZE=$(stat -c%s "${CODE}.osm.pbf")
          echo "Downloaded ${SIZE} bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Downloaded ${CODE}.osm.pbf is suspiciously small (${SIZE} bytes) - likely an error page, not a real PBF"
            exit 1
          fi

      - name: Download previous archive and source marker when available
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ matrix.country }}
        run: |
          mkdir -p previous
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "${CODE}.abm" --dir previous --clobber || true
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "${CODE}.source.sha256" --dir previous --clobber || true

      # ------------------------------------------------------------------
      # ویژگی ۵: اگر ABM قبلی موجود است و هش فایل OSM تازه‌دانلودشده با
      # هشی که موقع ساخت همان ABM ثبت شده یکی است، یعنی منبع تغییر
      # نکرده - دوباره از صفر نساز، همون آرشیو قبلی رو دوباره استفاده کن.
      # ------------------------------------------------------------------
      - name: Check whether source data changed since last publish
        env:
          CODE: ${{ matrix.country }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          NEW_HASH=$(sha256sum "${CODE}.osm.pbf" | cut -d' ' -f1)
          echo "New source sha256: $NEW_HASH"
          echo "SOURCE_SHA256=$NEW_HASH" >> "$GITHUB_ENV"

          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "force_rebuild is set - building regardless of source hash."
            echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
          elif [ -s "previous/${CODE}.abm" ] && [ -f "previous/${CODE}.source.sha256" ]; then
            OLD_HASH=$(tr -d '[:space:]' < "previous/${CODE}.source.sha256")
            echo "Previous source sha256: $OLD_HASH"
            if [ "$NEW_HASH" = "$OLD_HASH" ]; then
              echo "Source data for $CODE is unchanged since the last publish - skipping rebuild."
              echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
            else
              echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
            fi
          else
            echo "No usable previous ${CODE}.abm/source hash - building fresh."
            echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
          fi

      - name: Build and validate new archive
        if: env.SKIP_BUILD != 'true'
        env:
          CODE: ${{ matrix.country }}
        run: |
          mkdir -p dist
          python build_abm.py "${CODE}.osm.pbf" --country "$CODE" --output "dist/${CODE}.abm" --verbose

      - name: Reuse previous archive (source unchanged)
        if: env.SKIP_BUILD == 'true'
        env:
          CODE: ${{ matrix.country }}
        run: |
          mkdir -p dist
          cp "previous/${CODE}.abm" "dist/${CODE}.abm"
          echo "Reused previous/${CODE}.abm untouched - no source change detected."

      - name: Create incremental patch from previous archive
        if: env.SKIP_BUILD != 'true'
        env:
          CODE: ${{ matrix.country }}
        run: |
          if [ -s "previous/${CODE}.abm" ]; then
            mkdir -p "dist/${CODE}-patch"
            python packaging/create_patch.py \
              "previous/${CODE}.abm" "dist/${CODE}.abm" \
              --code "$CODE" --output "dist/${CODE}-patch" --chunk-size-mib 4
            PATCH_SIZE=$(stat -c%s "dist/${CODE}-patch/${CODE}.abmpatch.bin")
            FULL_SIZE=$(stat -c%s "dist/${CODE}.abm")
            echo "Patch bytes: $PATCH_SIZE / full bytes: $FULL_SIZE"
            # A patch larger than the full archive is not useful to clients.
            # Removing the descriptor makes the app use the normal full download.
            if [ "$PATCH_SIZE" -ge "$FULL_SIZE" ]; then
              rm -rf "dist/${CODE}-patch"
              echo 'Patch is not smaller than full archive; using full download.'
            fi
          else
            echo "No previous ${CODE}.abm; first publication uses full archive."
          fi

      - name: Record source hash for next run's freshness check
        env:
          CODE: ${{ matrix.country }}
        run: |
          mkdir -p dist
          printf '%s' "$SOURCE_SHA256" > "dist/${CODE}.source.sha256"

      - name: Build release manifest
        env:
          CODE: ${{ matrix.country }}
        run: |
          python packaging/build_release_manifest.py dist \
            --release-tag "$RELEASE_TAG" --names countries.json \
            --output dist/manifest-${CODE}.json

      - uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.country }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'schedule' || inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: map-*
          path: dist
          merge-multiple: true
      - name: Assemble one release manifest
        run: |
          python3 packaging/build_release_manifest.py dist \
            --release-tag "$RELEASE_TAG" --names countries.json \
            --output dist/manifest.json
      - name: Publish full archives, manifests, patches and source markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'Abtin Maps offline data' --notes 'Incremental offline map updates'
          find dist -type f \( -name '*.abm' -o -name '*.json' -o -name '*.bin' -o -name '*.sha256' \) -print0 \
            | xargs -0 -r gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
