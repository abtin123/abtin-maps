name: Build all offline maps

'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag holding map assets'
        required: true
        default: 'maps-v3'
        type: string
      countries_file:
        description: 'Optional repository-relative JSON file; empty means discover all Geofabrik countries automatically'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: offline-map-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build all countries and regional parts
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      COUNTRIES_FILE: ${{ inputs.countries_file }}
    steps:
      - name: Checkout map builder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade pip
          python -m pip install osmium zstandard brotli
          PMTILES_URL='https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz'
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 600 \
            "$PMTILES_URL" -o /tmp/go-pmtiles.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/go-pmtiles.tar.gz -C /tmp
          install -m 755 /tmp/pmtiles "$HOME/.local/bin/pmtiles"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmtiles version
          osmium --version

      - name: Fetch previous manifest when available
        run: |
          set -euo pipefail
          mkdir -p previous dist
          gh release download "$RELEASE_TAG" --pattern manifest.json --dir previous || true
          # Download existing country/region archives so the runner can verify
          # their hashes and skip rebuilding them.
          gh release download "$RELEASE_TAG" --pattern '*.abm' --dir dist || true

      - name: Build every country and regional part
        run: |
          set -euo pipefail
          chmod +x tool/maps/build_country_abm.sh tool/maps/build_all_maps.py
          args=(
            --root "$GITHUB_WORKSPACE"
            --output "$GITHUB_WORKSPACE/dist"
            --release-tag "$RELEASE_TAG"
          )
          if [ -n "$COUNTRIES_FILE" ]; then
            args+=(--countries-file "$GITHUB_WORKSPACE/$COUNTRIES_FILE")
          fi
          if [ -f previous/manifest.json ]; then
            args+=(--previous "$GITHUB_WORKSPACE/previous/manifest.json")
          fi
          python3 tool/maps/build_all_maps.py "${args[@]}"
          test -s dist/manifest.json
          python3 -m json.tool dist/manifest.json >/dev/null
          python3 -m json.tool dist/build-report.json >/dev/null

      - name: Verify every successful archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.abm)
          test "${#archives[@]}" -gt 0 || { echo 'No country archive succeeded.' >&2; exit 1; }
          for archive in "${archives[@]}"; do
            pmtiles verify "$archive"
          done

      - name: Publish all successful archives and final manifest
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Offline Maps" --notes "Offline country and regional map containers."
          fi
          gh release upload "$RELEASE_TAG" dist/*.abm dist/manifest.json dist/build-report.json --clobber
