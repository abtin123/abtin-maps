name: Recover Release From Run

# این ورک‌فلو برای بازیابی ران‌هایی است که build انجام شده و آرتیفکت‌ها
# آپلود شده‌اند، اما به هر دلیل جاب release اجرا نشده (مثلا باگ شرط
# needs.build.result که در build-abtin-map.yml فیکس شد).
# فقط run-id ران قبلی را بده تا هر چه از map-* آپلود شده را جمع کند،
# manifest بسازد و ریلیز کند — بدون نیاز به rebuild کشورهایی که فیل شدند.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'شناسه‌ی رانی که آرتیفکت‌های map-* را می‌خواهیم بازیابی کنیم'
        required: true
      release_tag:
        description: 'تگ ریلیز مقصد'
        required: false
        default: 'maps-v1'

permissions:
  contents: write
  actions: read

jobs:
  recover-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: دریافت artifact های ران مبدا
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: map-*
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: لیست کشورهای بازیابی‌شده
        run: |
          echo "### کشورهای بازیابی‌شده از ران #${{ github.event.inputs.source_run_id }}" >> $GITHUB_STEP_SUMMARY
          ls -1 merged | sed 's/^map-/- /' >> $GITHUB_STEP_SUMMARY
          ls -la merged

      - name: خواندن manifest ریلیز قبلی (برای حفظ کشورهای دست‌نخورده)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'maps-v1' }}
        run: |
          mkdir -p merged/prev-manifest
          if gh release download "${RELEASE_TAG}" --pattern manifest.json --dir prevdl 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          m = json.load(open("prevdl/manifest.json", encoding="utf-8"))
          os.makedirs("merged/prev-manifest", exist_ok=True)
          for c in m.get("countries", []):
              with open(f"merged/prev-manifest/manifest-{c['code']}.json", "w", encoding="utf-8") as f:
                  json.dump(c, f, ensure_ascii=False, indent=2)
          print(f"{len(m.get('countries', []))} کشور از ریلیز قبلی حفظ شد")
          PY
          else
            echo "ریلیز قبلی یافت نشد — manifest از صفر ساخته می‌شود"
          fi

      - name: ادغام manifest ها
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'maps-v1' }}
        run: |
          mkdir -p out
          python3 tools/merge_manifests.py \
            --in-dir merged \
            --out out/manifest.json \
            --release-tag "${RELEASE_TAG}"
          find merged -type f \( -name '*.abm' -o -name '*.abm.part*' \) -exec mv -t out/ {} +
          ls -lh out/

      - name: انتشار در ریلیز
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'maps-v1' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Abtin Maps ${{ env.RELEASE_TAG }}
          body: |
            نقشه‌های آفلاین ABTINMAP v1 (بازیابی‌شده از ران #${{ github.event.inputs.source_run_id }})
            manifest: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/manifest.json
          files: out/*
          fail_on_unmatched_files: true
          make_latest: true

      - name: خلاصه
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'maps-v1' }}
        run: |
          echo "### ریلیز \`${RELEASE_TAG}\` منتشر شد" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          m=json.load(open('out/manifest.json',encoding='utf-8'))
          print('| کشور | حجم | فایل‌ها |'); print('|---|---|---|')
          for c in m['countries']:
              print(f\"| {c['name_fa']} ({c['code']}) | {c['total_size']/1e6:.0f} MB | {len(c['files'])} |\")
          " >> $GITHUB_STEP_SUMMARY
