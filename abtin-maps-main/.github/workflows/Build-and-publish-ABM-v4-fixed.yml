name: Build and publish incremental ABM v4 map updates

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

  workflow_dispatch:
    inputs:
      country:
        description: 'کد کشور برای ساخت، یا all برای همه'
        required: false
        default: 'all'

      exclude:
        description: 'کد کشورهای مستثنی‌شده از all، مثلا IR,SE'
        required: false
        default: ''

      force_rebuild:
        description: 'حتی بدون تغییر OSM، ABM را از نو بساز'
        required: true
        type: boolean
        default: false

      publish:
        description: 'نتیجه در Release منتشر شود'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_TAG: maps-v4
  PYTHONUNBUFFERED: '1'

jobs:

  # ============================================================
  # DISCOVER COUNTRIES
  # ============================================================
  discover:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build country matrix
        id: matrix
        env:
          REQUESTED_COUNTRY: ${{ inputs.country || 'all' }}
          EXCLUDE_COUNTRIES: ${{ inputs.exclude || '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open("countries.json", encoding="utf-8") as f:
              data = json.load(f)

          requested = os.environ.get(
              "REQUESTED_COUNTRY", "all"
          ).strip().upper()

          exclude = {
              c.strip().upper()
              for c in os.environ.get(
                  "EXCLUDE_COUNTRIES", ""
              ).split(",")
              if c.strip()
          }

          unknown_exclude = sorted(
              c for c in exclude
              if c not in data
          )

          if unknown_exclude:
              raise SystemExit(
                  f"Unknown country code(s) in exclude: "
                  f"{unknown_exclude}"
              )

          if requested in ("", "ALL"):
              codes = sorted(
                  c for c in data
                  if c not in exclude
              )
          else:
              if requested not in data:
                  raise SystemExit(
                      f"Unknown country code: {requested}"
                  )

              codes = [requested]

          if not codes:
              raise SystemExit(
                  "No countries left to build."
              )

          matrix = {
              "country": codes
          }

          print(
              "matrix=" +
              json.dumps(
                  matrix,
                  separators=(",", ":")
              )
          )
          PY


  # ============================================================
  # BUILD / UPDATE EACH COUNTRY
  # ============================================================
  build:
    needs: discover

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install builder dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ----------------------------------------------------------
      # DOWNLOAD CURRENT OSM
      # ----------------------------------------------------------
      - name: Download current OSM extract
        env:
          CODE: ${{ matrix.country }}
        run: |
          set -e

          URL=$(python3 -c "
          import json
          print(
              json.load(
                  open('countries.json', encoding='utf-8')
              )['$CODE']['pbf_url']
          )
          ")

          echo "Country: $CODE"
          echo "OSM URL: $URL"

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" \
            -o "${CODE}.osm.pbf"

          SIZE=$(stat -c%s "${CODE}.osm.pbf")

          echo "Downloaded: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Downloaded PBF is suspiciously small."
            exit 1
          fi


      # ----------------------------------------------------------
      # DOWNLOAD PREVIOUS RELEASE DATA
      # ----------------------------------------------------------
      - name: Download previous ABM and source marker
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ matrix.country }}
        run: |
          set +e

          mkdir -p previous

          echo "Trying to download previous $CODE.abm"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${CODE}.abm" \
            --dir previous \
            --clobber

          echo "Trying to download previous source hash"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${CODE}.source.sha256" \
            --dir previous \
            --clobber

          echo "Previous files:"
          ls -lh previous || true


      # ----------------------------------------------------------
      # CHECK SOURCE CHANGE
      # ----------------------------------------------------------
      - name: Check OSM source change
        env:
          CODE: ${{ matrix.country }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          set -e

          NEW_HASH=$(
            sha256sum "${CODE}.osm.pbf" |
            cut -d' ' -f1
          )

          echo "Current source SHA256:"
          echo "$NEW_HASH"

          echo "SOURCE_SHA256=$NEW_HASH" >> "$GITHUB_ENV"

          if [ "$FORCE_REBUILD" = "true" ]; then

            echo "Force rebuild requested."

            echo "SKIP_BUILD=false" >> "$GITHUB_ENV"

          elif \
            [ -s "previous/${CODE}.abm" ] &&
            [ -f "previous/${CODE}.source.sha256" ]; then

            OLD_HASH=$(
              tr -d '[:space:]' \
              < "previous/${CODE}.source.sha256"
            )

            echo "Previous source SHA256:"
            echo "$OLD_HASH"

            if [ "$NEW_HASH" = "$OLD_HASH" ]; then

              echo "OSM source unchanged."
              echo "No rebuild required."

              echo "SKIP_BUILD=true" >> "$GITHUB_ENV"

            else

              echo "OSM source changed."

              echo "SKIP_BUILD=false" >> "$GITHUB_ENV"

            fi

          else

            echo "No previous usable ABM found."

            echo "Fresh build required."

            echo "SKIP_BUILD=false" >> "$GITHUB_ENV"

          fi


      # ----------------------------------------------------------
      # BUILD NEW ABM
      # ----------------------------------------------------------
      - name: Build ABM v4
        if: env.SKIP_BUILD != 'true'
        env:
          CODE: ${{ matrix.country }}
        run: |
          set -e

          mkdir -p dist

          python build_abm.py \
            "${CODE}.osm.pbf" \
            --country "$CODE" \
            --output "dist/${CODE}.abm" \
            --verbose

          test -s "dist/${CODE}.abm"

          echo "New ABM created:"
          ls -lh "dist/${CODE}.abm"


      # ----------------------------------------------------------
      # REUSE OLD ABM IF NOTHING CHANGED
      # ----------------------------------------------------------
      - name: Reuse previous ABM
        if: env.SKIP_BUILD == 'true'
        env:
          CODE: ${{ matrix.country }}
        run: |
          set -e

          mkdir -p dist

          cp \
            "previous/${CODE}.abm" \
            "dist/${CODE}.abm"

          echo "Reused previous ABM:"
          ls -lh "dist/${CODE}.abm"


      # ----------------------------------------------------------
      # CREATE PATCH ONLY WHEN SOURCE CHANGED
      # ----------------------------------------------------------
      - name: Create incremental patch
        if: env.SKIP_BUILD != 'true'
        env:
          CODE: ${{ matrix.country }}
        run: |
          set -e

          if [ -s "previous/${CODE}.abm" ]; then

            mkdir -p "dist/${CODE}-patch"

            python packaging/create_patch.py \
              "previous/${CODE}.abm" \
              "dist/${CODE}.abm" \
              --code "$CODE" \
              --output "dist/${CODE}-patch" \
              --chunk-size-mib 4

            PATCH="dist/${CODE}-patch/${CODE}.abmpatch.bin"
            FULL="dist/${CODE}.abm"

            if [ -s "$PATCH" ]; then

              PATCH_SIZE=$(stat -c%s "$PATCH")
              FULL_SIZE=$(stat -c%s "$FULL")

              echo "Patch size: $PATCH_SIZE"
              echo "Full ABM size: $FULL_SIZE"

              if [ "$PATCH_SIZE" -ge "$FULL_SIZE" ]; then

                echo "Patch is not smaller."
                echo "Removing patch."

                rm -rf "dist/${CODE}-patch"

              else

                echo "Patch is smaller."
                echo "Keeping patch."

              fi

            else

              echo "Patch was not generated."
              rm -rf "dist/${CODE}-patch"

            fi

          else

            echo "No previous ABM."
            echo "First publication uses full ABM."

          fi


      # ----------------------------------------------------------
      # SAVE SOURCE HASH
      # ----------------------------------------------------------
      - name: Save source hash
        env:
          CODE: ${{ matrix.country }}
        run: |
          set -e

          mkdir -p dist

          printf '%s' "$SOURCE_SHA256" \
            > "dist/${CODE}.source.sha256"

          cat "dist/${CODE}.source.sha256"


      # ----------------------------------------------------------
      # COUNTRY MANIFEST
      # ----------------------------------------------------------
      - name: Build country manifest
        env:
          CODE: ${{ matrix.country }}
        run: |
          set -e

          python packaging/build_release_manifest.py \
            dist \
            --release-tag "$RELEASE_TAG" \
            --names countries.json \
            --output "dist/manifest-${CODE}.json"

          test -s "dist/manifest-${CODE}.json"


      # ----------------------------------------------------------
      # ARTIFACT
      # ----------------------------------------------------------
      - name: Upload country artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.country }}
          path: dist/
          if-no-files-found: error


  # ============================================================
  # PUBLISH
  #
  # IMPORTANT:
  # The Release is NEVER deleted.
  # Existing assets are replaced with --clobber.
  # ============================================================
  publish:
    if: github.event_name == 'schedule' || inputs.publish == true

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Download all country artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: map-*
          path: dist
          merge-multiple: true


      # ----------------------------------------------------------
      # REMOVE PER-COUNTRY MANIFESTS
      # They are only build artifacts.
      # One final manifest is published.
      # ----------------------------------------------------------
      - name: Remove temporary manifests
        run: |
          find dist \
            -type f \
            -name 'manifest-*.json' \
            -delete


      # ----------------------------------------------------------
      # BUILD ONE FINAL MANIFEST
      # ----------------------------------------------------------
      - name: Build final manifest
        run: |
          set -e

          rm -f dist/manifest.json

          python3 packaging/build_release_manifest.py \
            dist \
            --release-tag "$RELEASE_TAG" \
            --names countries.json \
            --output dist/manifest.json

          test -s dist/manifest.json

          echo "===== FINAL MANIFEST ====="
          cat dist/manifest.json


      # ----------------------------------------------------------
      # MAKE SURE RELEASE EXISTS
      #
      # NEVER DELETE IT.
      # ----------------------------------------------------------
      - name: Ensure maps-v4 release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then

            echo "Release $RELEASE_TAG already exists."

          else

            echo "Release does not exist."
            echo "Creating $RELEASE_TAG."

            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Abtin Maps offline data" \
              --notes "ABM v4 offline map data"

          fi


      # ----------------------------------------------------------
      # SHOW WHAT WILL BE PUBLISHED
      # ----------------------------------------------------------
      - name: Show publication files
        run: |
          echo "===== FILES TO PUBLISH ====="

          find dist \
            -type f \
            \( \
              -name '*.abm' \
              -o -name '*.source.sha256' \
              -o -name '*.abmpatch.bin' \
              -o -name '*.abmpatch.json' \
              -o -name 'patch-descriptor.json' \
              -o -name 'manifest.json' \
            \) \
            -printf '%p %s bytes\n' |
            sort


      # ----------------------------------------------------------
      # UPLOAD ABM
      #
      # --clobber replaces the old country ABM.
      # Release itself stays.
      # ----------------------------------------------------------
      - name: Publish ABM archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          find dist \
            -type f \
            -name '*.abm' \
            -print0 |
          while IFS= read -r -d '' file; do

            echo
            echo "================================"
            echo "Uploading ABM:"
            echo "$file"
            echo "================================"

            timeout 20m \
              gh release upload \
                "$RELEASE_TAG" \
                "$file" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber

          done


      # ----------------------------------------------------------
      # UPLOAD SOURCE HASHES
      # ----------------------------------------------------------
      - name: Publish source hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          find dist \
            -type f \
            -name '*.source.sha256' \
            -print0 |
          while IFS= read -r -d '' file; do

            echo "Uploading source hash:"
            echo "$file"

            timeout 2m \
              gh release upload \
                "$RELEASE_TAG" \
                "$file" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber

          done


      # ----------------------------------------------------------
      # UPLOAD PATCHES
      # ----------------------------------------------------------
      - name: Publish patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          find dist \
            -type f \
            \( \
              -name '*.abmpatch.bin' \
              -o -name '*.abmpatch.json' \
              -o -name 'patch-descriptor.json' \
            \) \
            -print0 |
          while IFS= read -r -d '' file; do

            echo "Uploading patch:"
            echo "$file"

            timeout 20m \
              gh release upload \
                "$RELEASE_TAG" \
                "$file" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber

          done


      # ----------------------------------------------------------
      # UPLOAD FINAL MANIFEST LAST
      #
      # This is intentional:
      # App should only see the new manifest after ABMs are uploaded.
      # ----------------------------------------------------------
      - name: Publish final manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          test -s dist/manifest.json

          timeout 2m \
            gh release upload \
              "$RELEASE_TAG" \
              dist/manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --clobber


      # ----------------------------------------------------------
      # VERIFY RELEASE
      # ----------------------------------------------------------
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo
          echo "======================================"
          echo "FINAL RELEASE ASSETS"
          echo "======================================"

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' |
            sort

          echo
          echo "Checking manifest..."

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' |
            grep -qx 'manifest.json'

          echo
          echo "Checking ABM files..."

          ABM_COUNT=$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' |
              grep -E '\.abm$' |
              wc -l
          )

          echo "Published ABM count: $ABM_COUNT"

          if [ "$ABM_COUNT" -lt 1 ]; then
            echo "::error::No ABM files were published."
            exit 1
          fi

          echo
          echo "======================================"
          echo "RELEASE VERIFICATION OK"
          echo "======================================"