[supervisord]
nodaemon=false
logfile=/tmp/abtin-supervisord.log
pidfile=/tmp/abtin-supervisord.pid

[unix_http_server]
file=/tmp/abtin-supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/abtin-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:backend]
directory=/home/ubuntu/work_phase6/abtin-distribution/backend
command=/usr/bin/env DJANGO_SETTINGS_MODULE=config.settings.dev USE_SQLITE=1 python manage.py runserver 0.0.0.0:8000
autostart=true
autorestart=true
stdout_logfile=/tmp/abtin-backend.log
stderr_logfile=/tmp/abtin-backend.err

[program:frontend]
directory=/home/ubuntu/work_phase6/abtin-distribution/frontend
command=/home/ubuntu/.nvm/versions/node/v22.13.0/bin/npm run dev -- --host 0.0.0.0
autostart=true
autorestart=true
stdout_logfile=/tmp/abtin-frontend.log
stderr_logfile=/tmp/abtin-frontend.err
