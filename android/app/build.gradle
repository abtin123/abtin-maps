plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "ir.abtin.abtin_navigator"
    compileSdkVersion 36
    ndkVersion "28.1.13356709"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "ir.abtin.abtin_navigator"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    def keystorePropsFile = rootProject.file('key.properties')
    def keystoreProps = new Properties()
    def hasKeystoreProps = keystorePropsFile.exists()
    if (hasKeystoreProps) {
        keystorePropsFile.withReader('UTF-8') { reader -> keystoreProps.load(reader) }
    }

    // اولویت با android/key.properties (لوکال) سپس متغیرهای محیطی CI
    // (ABTIN_KEYSTORE_PATH/PASSWORD/ALIAS/KEY_PASSWORD) — هیچ‌کدام hardcode نشده.
    def ksStorePath = hasKeystoreProps ? keystoreProps['storeFile'] : System.getenv('ABTIN_KEYSTORE_PATH')
    def ksStorePassword = hasKeystoreProps ? keystoreProps['storePassword'] : System.getenv('ABTIN_KEYSTORE_PASSWORD')
    def ksKeyAlias = hasKeystoreProps ? keystoreProps['keyAlias'] : System.getenv('ABTIN_KEYSTORE_ALIAS')
    def ksKeyPassword = hasKeystoreProps ? keystoreProps['keyPassword'] : System.getenv('ABTIN_KEYSTORE_KEY_PASSWORD')
    def hasSigningConfig = ksStorePath && ksStorePassword && ksKeyAlias && ksKeyPassword

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile file(ksStorePath)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // فعال‌سازی بهینه‌سازی حجم و امنیت کد
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // اگر امضای ریلیز تنظیم نشده باشد (مثلاً روی CI بدون سکرت)، به‌جای
            // شکست خوردن بیلد، از امضای دیباگ استفاده می‌شود تا APK همچنان ساخته شود.
            signingConfig hasSigningConfig ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
        pickFirst "lib/**/libjsc.so"
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
}
