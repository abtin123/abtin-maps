name: Weekly ABM country rebuild
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      country:
        description: ISO country code
        required: true
        default: IR
      pbf_url:
        description: HTTPS URL of the current country OSM PBF
        required: true
      regions_config:
        description: >
          Optional path (in this repo) to a regions/<CC>.json config for
          countries too large for a single archive (e.g. regions/US.json).
          Leave empty for a normal single-file country build.
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COUNTRY: ${{ inputs.country || 'IR' }}
      PBF_URL: ${{ inputs.pbf_url || 'https://download.geofabrik.de/asia/iran-latest.osm.pbf' }}
      REGIONS_CONFIG: ${{ inputs.regions_config }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: mkdir -p work dist
      - run: curl -L --fail --retry 3 "$PBF_URL" -o work/country.osm.pbf

      # Whole-country build (no regions config given).
      - name: Build whole-country ABM
        if: ${{ env.REGIONS_CONFIG == '' }}
        run: python build_abm.py work/country.osm.pbf --country "$COUNTRY" --output dist/$COUNTRY.abm

      # Large-country build: real geographic split, one .abm per region -
      # NOT the byte-chunker below, which only exists for hosting size caps.
      - name: Build per-region ABM archives
        if: ${{ env.REGIONS_CONFIG != '' }}
        run: python build_abm.py work/country.osm.pbf --country "$COUNTRY" --regions "$REGIONS_CONFIG" --output dist/

      - name: Split any archive over the GitHub Release asset cap
        run: |
          for abm in dist/*.abm; do
            code=$(basename "$abm" .abm)
            size=$(stat -c%s "$abm")
            if [ "$size" -gt 1932735283 ]; then  # ~1.8 GiB
              python packaging/split_abm.py split "$abm" --output "dist/$code-parts"
            fi
          done

      - name: Download previous release archives for delta patches
        run: |
          mkdir -p work/previous
          for abm in dist/*.abm; do
            code=$(basename "$abm" .abm)
            gh release download maps-v4 --pattern "$code.abm" --dir work/previous || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create delta patches for codes with a previous release
        run: |
          for abm in dist/*.abm; do
            code=$(basename "$abm" .abm)
            if [ -f "work/previous/$code.abm" ]; then
              python packaging/create_patch.py "work/previous/$code.abm" "$abm" --code "$code" --output "dist/$code-patch"
            else
              echo "No previous archive for $code; full ABM will be published."
            fi
          done

      - name: Build release manifest.json
        run: |
          python packaging/build_release_manifest.py dist \
            --release-tag maps-v4 \
            --names names.json \
            --output dist/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: abm-${{ env.COUNTRY }}
          path: dist/
