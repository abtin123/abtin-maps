name: Extract All Zips and Remove Them

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Find, extract and delete all zip files
        run: |
          find . -type f -name "*.zip" | while read -r zip_file; do
            echo "Extracting: $zip_file"
            extract_dir=$(dirname "$zip_file")
            unzip -o "$zip_file" -d "$extract_dir"
            rm -f "$zip_file"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract all zip files and remove archives" || echo "Nothing to commit"
          git push
        
