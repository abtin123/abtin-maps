name: Build offline maps v4

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag consumed by the app'
        required: true
        default: 'maps-v4'
        type: string
      country_selector:
        description: 'IR for Iran, ALL for every Geofabrik extract, or ALL/IR/AZ to exclude countries'
        required: true
        default: 'IR'
        type: string
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || 'maps-v4' }}
  COUNTRY_SELECTOR: ${{ inputs.country_selector || 'IR' }}

concurrency:
  group: abtin-maps-release-${{ inputs.release_tag || 'maps-v4' }}
  cancel-in-progress: false

jobs:
  catalog:
    name: Discover Geofabrik catalog
    runs-on: ubuntu-24.04
    outputs:
      chunks: ${{ steps.select.outputs.chunks }}
      chunk_count: ${{ steps.select.outputs.chunk_count }}
      selected_count: ${{ steps.select.outputs.selected_count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Discover catalog
        run: |
          set -euo pipefail
          python3 tool/maps/discover_map_catalog.py --output /tmp/map-catalog.json
          python3 -m json.tool /tmp/map-catalog.json >/dev/null
      - id: select
        env:
          SELECTOR: ${{ env.COUNTRY_SELECTOR }}
        run: |
          set -euo pipefail
          python3 - "$SELECTOR" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          entries = json.load(open('/tmp/map-catalog.json', encoding='utf-8'))
          selector = sys.argv[1].strip().upper()
          tokens = [x.strip() for x in selector.split('/') if x.strip()]
          if not tokens:
              raise SystemExit('country-selector is empty')
          if tokens[0] == 'ALL':
              excluded = set(tokens[1:])
              entries = [e for e in entries if str(e.get('country_code','')).upper() not in excluded and str(e.get('code','')).upper() not in excluded]
          else:
              wanted = set(tokens)
              entries = [e for e in entries if str(e.get('country_code','')).upper() in wanted or str(e.get('code','')).upper() in wanted]
          if not entries:
              raise SystemExit(f'country-selector matched no catalog entries: {selector}')
          count = min(64, len(entries))
          print('chunks=' + json.dumps(list(range(count)), separators=(',', ':')))
          print(f'chunk_count={count}')
          print(f'selected_count={len(entries)}')
          print('selected_codes=' + json.dumps([str(e.get('code','')).upper() for e in entries], separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: map-catalog
          path: /tmp/map-catalog.json
          retention-days: 3

  build-chunk:
    name: Build map chunk ${{ matrix.chunk }}
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.catalog.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          name: map-catalog
          path: catalog
      - name: Install map build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          PMTILES_URL='https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz'
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 600 "$PMTILES_URL" -o /tmp/go-pmtiles.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/go-pmtiles.tar.gz -C /tmp
          install -m 755 /tmp/pmtiles "$HOME/.local/bin/pmtiles"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmtiles version
          osmium --version
          docker --version
      - name: Fetch previous release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous dist patches old
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern manifest.json --dir previous || true
            gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > previous/assets.txt
          else
            : > previous/assets.txt
          fi
      - name: Build selected maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x tool/maps/*.sh tool/maps/*.py
          args=(
            --root "$GITHUB_WORKSPACE"
            --output "$GITHUB_WORKSPACE/dist"
            --release-tag "$RELEASE_TAG"
            --chunk-index "${{ matrix.chunk }}"
            --chunk-count "${{ needs.catalog.outputs.chunk_count }}"
            --countries-file "$GITHUB_WORKSPACE/catalog/map-catalog.json"
            --country-selector "$COUNTRY_SELECTOR"
          )
          if [ -f previous/manifest.json ]; then
            args+=(--previous "$GITHUB_WORKSPACE/previous/manifest.json")
          fi
          if [ -s previous/assets.txt ]; then
            args+=(--existing-assets "$GITHUB_WORKSPACE/previous/assets.txt")
          fi
          python3 tool/maps/build_all_maps.py "${args[@]}"
          python3 -m json.tool dist/manifest.json >/dev/null
          python3 -m json.tool dist/build-report.json >/dev/null
      - name: Build block patches for changed single-file maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in dist/*.abm; do
            code="$(basename "$archive" .abm)"
            rm -rf "old/$code"
            mkdir -p "old/$code"
            if gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern "${code}.abm" --dir "old/$code" >/dev/null 2>&1; then
              python3 tool/maps/generate_chunk_patch.py \
                --base "old/$code/${code}.abm" \
                --target "$archive" \
                --code "$code" \
                --output-dir patches
            fi
          done
          python3 tool/maps/attach_patches.py --manifest dist/manifest.json --patch-dir patches
      - name: Verify newly built ABMs
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in dist/*.abm; do
            code="$(basename "$archive" .abm)"
            python3 tool/maps/verify_abm_container.py "$archive" --region "$code"
          done
      - name: Upload chunk output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-dist-${{ matrix.chunk }}
          path: |
            dist/
            patches/
          if-no-files-found: warn
          retention-days: 3

  merge-and-publish:
    name: Verify and publish maps-v4
    needs: [catalog, build-chunk]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: map-dist-*
          path: chunk-output
          merge-multiple: false
      - name: Fetch previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous release-dist
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern manifest.json --dir previous || true
          fi
      - name: Build expected selected catalog
        run: |
          set -euo pipefail
          python3 tool/maps/discover_map_catalog.py --output expected-entries.json
          python3 - "$COUNTRY_SELECTOR" <<'PY'
          import json, sys
          from pathlib import Path
          entries = json.loads(Path('expected-entries.json').read_text(encoding='utf-8'))
          selector = sys.argv[1].strip().upper()
          tokens = [x.strip() for x in selector.split('/') if x.strip()]
          if tokens[0] == 'ALL':
              excluded = set(tokens[1:])
              entries = [e for e in entries if str(e.get('country_code','')).upper() not in excluded and str(e.get('code','')).upper() not in excluded]
          else:
              wanted = set(tokens)
              entries = [e for e in entries if str(e.get('country_code','')).upper() in wanted or str(e.get('code','')).upper() in wanted]
          if not entries:
              raise SystemExit(f'No maps matched {selector}')
          Path('expected-catalog.json').write_text(json.dumps({
              'release_tag': '${{ env.RELEASE_TAG }}',
              'count': len(entries),
              'entries': entries,
              'selector': selector,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Expected maps: {len(entries)}')
          PY
      - name: Refuse incomplete build
        if: ${{ needs.build-chunk.result != 'success' }}
        run: |
          echo 'At least one map build chunk failed. No Release is published.' >&2
          exit 1
      - name: Merge and verify manifest
        run: |
          set -euo pipefail
          args=(
            --input-root "$GITHUB_WORKSPACE/chunk-output"
            --output "$GITHUB_WORKSPACE/release-dist"
            --release-tag "$RELEASE_TAG"
            --expected-catalog "$GITHUB_WORKSPACE/expected-catalog.json"
          )
          if [ -f previous/manifest.json ]; then
            args+=(--previous "$GITHUB_WORKSPACE/previous/manifest.json")
          fi
          python3 tool/maps/merge_map_outputs.py "${args[@]}"
          python3 tool/maps/verify_release_catalog.py --catalog expected-catalog.json --manifest release-dist/manifest.json
          python3 -m json.tool release-dist/manifest.json >/dev/null
          python3 -m json.tool release-dist/build-report.json >/dev/null
      - name: Collect changed map and patch assets
        run: |
          set -euo pipefail
          find chunk-output -type f \( -name '*.abm' -o -name '*.abm.part*' -o -name '*.patch.json' -o -name '*.patch.bin' \) -print0 |
            while IFS= read -r -d '' f; do cp -f "$f" release-dist/; done
          cp -f release-dist/manifest.json release-dist/build-report.json .
      - name: Validate asset sizes and release limit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in release-dist/*; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            case "$(basename "$f")" in
              *.abm|*.abm.part*|*.patch.bin)
                test "$size" -lt $((2*1024*1024*1024)) || { echo "Release asset too large: $f" >&2; exit 1; }
                ;;
            esac
          done
          existing=0
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          fi
          new_unique=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$name"; then
              new_unique=$((new_unique + 1))
            fi
          done < <(find release-dist -maxdepth 1 -type f -printf '%f\n')
          total=$((existing + new_unique))
          test "$total" -le 1000 || { echo "Release would exceed GitHub's 1000-asset limit: $total" >&2; exit 1; }
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --title 'Abtin Offline Maps' \
              --notes 'ABTINMAP v4 offline map release. Generated from OpenStreetMap/Geofabrik snapshots; unchanged extracts are preserved.'
          fi
          files=(release-dist/manifest.json release-dist/build-report.json)
          shopt -s nullglob
          files+=(release-dist/*.abm release-dist/*.abm.part* release-dist/*.patch.json release-dist/*.patch.bin)
          existing=()
          for f in "${files[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          test "${#existing[@]}" -gt 0 || { echo 'Nothing to publish' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "${existing[@]}" --clobber
          echo "Published $RELEASE_TAG successfully."
