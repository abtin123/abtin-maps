name: ABM Builder CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python build_abm.py sample/mini_country.jsonl --country IR --output /tmp/iran.abm
      - run: python packaging/verify_abm.py /tmp/iran.abm
      - run: pytest -q
