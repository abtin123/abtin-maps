name: Build Iran GraphHopper Graphs (Per Province)

on:
  workflow_dispatch:

jobs:
  build-graphs:
    runs-on: ubuntu-latest
    steps:
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Download Iran OSM data
        run: |
          curl -L -o iran-latest.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf

      - name: Download GraphHopper
        run: |
          curl -L -o graphhopper.jar https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/9.1/graphhopper-web-9.1.jar

      - name: Create shared custom model
        run: |
          cat > car_custom.json << 'JSON'
          {
            "speed": [
              { "if": "true", "limit_to": "100" }
            ]
          }
          JSON

      - name: Create province list
        run: |
          cat > provinces.csv << 'CSV'
          tehran,50.2,35.0,52.7,36.3
          alborz,50.3,35.6,51.4,36.5
          isfahan,49.0,30.7,55.5,34.4
          fars,50.5,27.0,55.6,31.4
          khorasan_razavi,56.3,33.8,61.3,37.7
          east_azerbaijan,45.0,36.6,48.4,39.4
          west_azerbaijan,43.5,35.9,47.4,39.8
          khuzestan,47.6,29.9,50.9,33.0
          mazandaran,50.3,35.9,54.1,36.9
          gilan,48.5,36.6,50.6,38.5
          kerman,53.4,26.5,59.3,32.0
          khorasan_south,57.0,30.5,60.9,34.5
          sistan,58.8,25.0,63.4,31.5
          yazd,52.6,29.8,57.1,33.5
          hormozgan,52.5,25.4,59.3,28.9
          kermanshah,45.4,33.7,48.2,35.4
          golestan,53.5,36.5,56.4,38.1
          lorestan,46.8,32.6,50.3,34.5
          hamadan,47.6,34.0,49.6,35.8
          kurdistan,45.5,34.7,48.2,36.5
          markazi,48.9,33.4,51.3,35.4
          qazvin,48.8,35.4,50.6,36.9
          zanjan,47.1,35.7,49.5,37.5
          ardabil,47.3,37.2,48.9,39.8
          semnan,51.7,34.3,57.2,37.2
          qom,50.2,34.2,51.6,35.2
          chaharmahal,49.5,31.3,51.5,32.7
          kohgiluyeh,49.7,30.0,51.6,31.5
          bushehr,50.0,27.4,52.6,30.3
          ilam,45.4,32.0,48.4,34.4
          khorasan_north,55.8,36.5,58.5,38.2
          CSV

      - name: Build graph per province
        run: |
          mkdir -p out
          while IFS=',' read -r id left bottom right top; do
            echo "=== Processing $id ($left,$bottom,$right,$top) ==="

            osmium extract -b "$left,$bottom,$right,$top" iran-latest.osm.pbf -o "$id.osm.pbf" --overwrite

            cat > "config-$id.yml" << CFG
          graphhopper:
            datareader.file: $id.osm.pbf
            graph.location: graph-cache-$id
            import.osm.ignored_highways: ""
            profiles:
              - name: car
                custom_model_files: [car_custom.json]
            profiles_ch:
              - profile: car
          CFG

            java -Xmx6g -jar graphhopper.jar import "config-$id.yml"

            zip -r "out/${id}-graph.zip" "graph-cache-$id"

            # پاک‌سازی برای آزاد شدن فضا قبل از استان بعدی
            rm -rf "graph-cache-$id" "$id.osm.pbf" "config-$id.yml"
          done < provinces.csv

      - name: Upload as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: graph-iran-provinces-latest
          files: out/*-graph.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
