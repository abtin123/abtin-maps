name: Delete Repo Files

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'مسیر فایل‌ها/پوشه‌ها برای حذف (با کاما جدا کن)'
        required: true
        type: string
      commit_message:
        description: 'پیام کامیت'
        required: false
        default: 'chore: delete files'

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Delete specified files
        run: |
          IFS=',' read -ra PATHS <<< "${{ github.event.inputs.paths }}"
          for p in "${PATHS[@]}"; do
            trimmed=$(echo "$p" | xargs)
            echo "Deleting: $trimmed"
            rm -rf "$trimmed"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${{ github.event.inputs.commit_message }}" || echo "چیزی برای کامیت نبود"
          git push
