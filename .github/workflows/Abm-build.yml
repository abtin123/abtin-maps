name: Build map

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code to build, or all'
        required: false
        default: 'all'
      publish:
        description: 'Publish assets to the maps-v4 release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_TAG: maps-v4
  PYTHONUNBUFFERED: '1'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          REQUESTED_COUNTRY: ${{ inputs.country || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open('countries.json', encoding='utf-8'))
          requested = os.environ.get('REQUESTED_COUNTRY', 'all').strip().upper()
          codes = sorted(data) if requested in ('', 'ALL') else [requested]
          unknown = [c for c in codes if c not in data]
          if unknown:
              raise SystemExit(f'Unknown country code(s): {unknown}')
          print('matrix=' + json.dumps({'country': codes}, separators=(',', ':')))
          PY

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install builder dependencies
        run: pip install -r requirements.txt
      - name: Download current OSM extract
        env:
          CODE: ${{ matrix.country }}
        run: |
          URL=$(python3 -c "import json;print(json.load(open('countries.json',encoding='utf-8'))['$CODE']['pbf_url'])")
          echo "Downloading $URL"
          curl -L --fail --retry 3 --retry-delay 5 "$URL" -o "${CODE}.osm.pbf"
          SIZE=$(stat -c%s "${CODE}.osm.pbf")
          echo "Downloaded ${SIZE} bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Downloaded ${CODE}.osm.pbf is suspiciously small (${SIZE} bytes) - likely an error page, not a real PBF"
            exit 1
          fi
      - name: Download previous archive when available
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ matrix.country }}
        run: |
          mkdir -p previous
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "${CODE}.abm" --dir previous --clobber || true
      - name: Build and validate new archive
        env:
          CODE: ${{ matrix.country }}
        run: |
          mkdir -p dist
          python build_abm.py "${CODE}.osm.pbf" --country "$CODE" --output "dist/${CODE}.abm" --verbose
      - name: Create incremental patch from previous archive
        env:
          CODE: ${{ matrix.country }}
        run: |
          if [ -s "previous/${CODE}.abm" ]; then
            mkdir -p "dist/${CODE}-patch"
            python packaging/create_patch.py \
              "previous/${CODE}.abm" "dist/${CODE}.abm" \
              --code "$CODE" --output "dist/${CODE}-patch" --chunk-size-mib 4
            PATCH_SIZE=$(stat -c%s "dist/${CODE}-patch/${CODE}.abmpatch.bin")
            FULL_SIZE=$(stat -c%s "dist/${CODE}.abm")
            echo "Patch bytes: $PATCH_SIZE / full bytes: $FULL_SIZE"
            # A patch larger than the full archive is not useful to clients.
            # Removing the descriptor makes the app use the normal full download.
            if [ "$PATCH_SIZE" -ge "$FULL_SIZE" ]; then
              rm -rf "dist/${CODE}-patch"
              echo 'Patch is not smaller than full archive; using full download.'
            fi
          else
            echo "No previous ${CODE}.abm; first publication uses full archive."
          fi
      - name: Build release manifest
        env:
          CODE: ${{ matrix.country }}
        run: |
          python packaging/build_release_manifest.py dist \
            --release-tag "$RELEASE_TAG" --names countries.json \
            --output dist/manifest-${CODE}.json
      - uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.country }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'schedule' || inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: map-*
          path: dist
          merge-multiple: true
      - name: Assemble one release manifest
        run: |
          python3 packaging/build_release_manifest.py dist \
            --release-tag "$RELEASE_TAG" --names countries.json \
            --output dist/manifest.json
      - name: Publish full archives, manifests and patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'Abtin Maps offline data' --notes 'Incremental offline map updates'
          find dist -type f \( -name '*.abm' -o -name '*.json' -o -name '*.bin' \) -print0 \
            | xargs -0 -r gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
