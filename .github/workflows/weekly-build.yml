name: ABM World Weekly Build + Delta

on:
  workflow_dispatch:
    inputs:
      target:
        description: "all | all/IR | IR"
        required: true
        default: "all"

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: resolve
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"

          python3 scripts/resolve_build_targets.py \
            --target "$TARGET" \
            --output build-matrix.json

          echo "matrix=$(cat build-matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check previous manifest
        id: state
        shell: bash
        run: |
          python3 scripts/check_build_state.py \
            --country "${{ matrix.country }}" \
            --region "${{ matrix.region }}" \
            --output state.json

          cat state.json

      - name: Download OSM source
        if: steps.state.outputs.needs_build == 'true'
        run: |
          python3 scripts/update_osm.py \
            --country "${{ matrix.country }}" \
            --region "${{ matrix.region }}"

      - name: Build ABM
        if: steps.state.outputs.needs_build == 'true'
        run: |
          python3 build_abm.py \
            --country "${{ matrix.country }}" \
            --region "${{ matrix.region }}" \
            --memory-safe \
            --stream-routing

      - name: Validate ABM
        if: steps.state.outputs.needs_build == 'true'
        run: |
          python3 validate_abm.py \
            --country "${{ matrix.country }}" \
            --region "${{ matrix.region }}"

      - name: Build Delta
        if: steps.state.outputs.needs_delta == 'true'
        run: |
          python3 packaging/create_patch.py \
            --country "${{ matrix.country }}" \
            --region "${{ matrix.region }}"

      - name: Resolve country flag
        if: steps.state.outputs.needs_build == 'true'
        shell: bash
        run: |
          FLAG="assets/flags/$(echo '${{ matrix.country }}' | tr '[:upper:]' '[:lower:]').webp"

          test -f "$FLAG" || {
            echo "Missing local country flag: $FLAG"
            exit 1
          }

          echo "FLAG=$FLAG" >> "$GITHUB_ENV"

      - name: Build manifest
        if: steps.state.outputs.needs_build == 'true'
        run: |
          python3 packaging/build_release_manifest.py \
            --country "${{ matrix.country }}" \
            --region "${{ matrix.region }}" \
            --flag "$FLAG"

      - name: Upload release
        if: steps.state.outputs.needs_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: abm-${{ matrix.country }}-${{ matrix.region }}
          path: |
            release/**
