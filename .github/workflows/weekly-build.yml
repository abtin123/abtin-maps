name: Weekly ABM rebuild (all countries)
on:
  schedule:
    - cron: '17 2 * * 1'   # every Monday 02:17 UTC - rebuilds every country in countries.json
  workflow_dispatch:
    inputs:
      country:
        description: >
          Optional: ISO country code to rebuild ONLY that one (for a quick
          manual test/hotfix). Leave empty to rebuild every country in
          countries.json, same as the scheduled run.
        required: false
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          python3 - << 'PYEOF' >> "$GITHUB_OUTPUT"
          import json, os
          countries = json.load(open('countries.json'))
          only = os.environ.get('ONLY_COUNTRY', '').strip().upper()
          codes = [only] if only else sorted(countries.keys())
          matrix = []
          for code in codes:
              c = countries[code]
              matrix.append({
                  'code': code,
                  'pbf_url': c['pbf_url'],
                  'regions_config': c.get('regions_config', ''),
              })
          print('matrix=' + json.dumps({'include': matrix}))
          PYEOF
        env:
          ONLY_COUNTRY: ${{ inputs.country }}

  build:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false   # one broken country must not cancel the other 36+
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: mkdir -p work dist
      - name: Download OSM extract for ${{ matrix.code }}
        run: curl -L --fail --retry 3 "${{ matrix.pbf_url }}" -o work/country.osm.pbf

      - name: Build whole-country ABM
        if: ${{ matrix.regions_config == '' }}
        run: python build_abm.py work/country.osm.pbf --country "${{ matrix.code }}" --output "dist/${{ matrix.code }}.abm"

      - name: Build per-region ABM archives (large country)
        if: ${{ matrix.regions_config != '' }}
        run: python build_abm.py work/country.osm.pbf --country "${{ matrix.code }}" --regions "${{ matrix.regions_config }}" --output dist/

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          echo "Build completed for ${{ matrix.code }}"
          find dist -maxdepth 2 -type f -name '*.abm' -print -exec stat -c '%n %s bytes' {} \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.abm' -print -quit)"

      - name: Split any archive over the GitHub Release asset cap
        run: |
          for abm in dist/*.abm; do
            [ -e "$abm" ] || continue
            code=$(basename "$abm" .abm)
            size=$(stat -c%s "$abm")
            if [ "$size" -gt 1932735283 ]; then  # ~1.8 GiB
              python packaging/split_abm.py split "$abm" --output "dist/$code-parts"
            fi
          done

      - name: Download previous release archives for delta patches
        run: |
          mkdir -p work/previous
          for abm in dist/*.abm; do
            [ -e "$abm" ] || continue
            code=$(basename "$abm" .abm)
            gh release download maps-v4 --pattern "$code.abm" --dir work/previous || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create delta patches where a previous release exists
        run: |
          for abm in dist/*.abm; do
            [ -e "$abm" ] || continue
            code=$(basename "$abm" .abm)
            if [ -f "work/previous/$code.abm" ]; then
              python packaging/create_patch.py "work/previous/$code.abm" "$abm" --code "$code" --output "dist/$code-patch"
            else
              echo "No previous archive for $code; full ABM will be published."
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.code }}
          path: dist/

  manifest:
    needs: build
    # A cancelled build cannot have a complete release. For failed builds we
    # still aggregate any country artifacts that finished successfully.
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    outputs:
      has_artifacts: ${{ steps.check.outputs.has_artifacts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Merge every country's artifact into one dist/
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: merged
          merge-multiple: false
      - name: Merge and check artifacts
        id: check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Each dist-<CODE> artifact unpacks to merged/dist-<CODE>/...
          found=0
          shopt -s nullglob
          for d in merged/dist-*; do
            [ -d "$d" ] || continue
            for f in "$d"/*.abm "$d"/*-patch* "$d"/*-parts*; do
              [ -e "$f" ] || continue
              cp -rn "$f" dist/ 2>/dev/null || true
            done
          done
          if find dist -maxdepth 1 -type f -name '*.abm' -print -quit | grep -q .; then
            found=1
          fi
          echo "has_artifacts=$found" >> "$GITHUB_OUTPUT"
          echo "Release ABM artifacts present: $found"
          find dist -maxdepth 2 -type f -printf '%p %s bytes\\n' | sort || true

      - name: Build release manifest.json
        if: ${{ steps.check.outputs.has_artifacts == '1' }}
        run: python packaging/build_release_manifest.py dist --release-tag maps-v4 --names countries.json --output dist/manifest.json

      - name: No completed country artifacts
        if: ${{ steps.check.outputs.has_artifacts != '1' }}
        run: |
          echo "No completed .abm artifacts were produced; skipping manifest/release publication."
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: abtinmaps-release
          path: dist/

  publish:
    needs: manifest
    if: ${{ needs.manifest.result == 'success' && needs.manifest.outputs.has_artifacts == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: abtinmaps-release, path: dist}
      - name: Publish/update the maps-v4 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maps-v4
          files: dist/**
          fail_on_unmatched_files: true
