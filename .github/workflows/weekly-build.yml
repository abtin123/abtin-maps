name: Weekly ABM Build + Delta Update

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      region:
        description: "Region to build"
        required: false
        default: "IR"

permissions:
  contents: write

jobs:
  build-abm:
    runs-on: ubuntu-latest

    env:
      REGION: IR
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore previous ABM cache
        uses: actions/cache@v4
        with:
          path: previous/
          key: abm-previous-${{ env.REGION }}

      - name: Download latest OSM data
        run: |
          python tools/update_osm.py --region $REGION

      - name: Build ABM
        run: |
          python build_abm.py \
            --region $REGION \
            --memory-safe \
            --stream-routing \
            --output release/${REGION}.abm

      - name: Validate ABM
        run: |
          python validate_abm.py release/${REGION}.abm

      - name: Build Delta Patch
        run: |
          python packaging/create_patch.py \
            --old previous/${REGION}.abm \
            --new release/${REGION}.abm \
            --output release/${REGION}.patch

      - name: Create manifest
        run: |
          python packaging/build_release_manifest.py \
            --abm release/${REGION}.abm \
            --patch release/${REGION}.patch \
            --output release/${REGION}.manifest.json

      - name: Save current version
        run: |
          mkdir -p previous
          cp release/${REGION}.abm previous/${REGION}.abm

      - name: Upload ABM Release
        uses: actions/upload-artifact@v4
        with:
          name: abm-${{ env.REGION }}
          path: |
            release/*.abm
            release/*.patch
            release/*.manifest.json
