name: Build and Publish ABM v4

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Country to build, e.g. AM or IR"
        required: true
        default: "AM"

permissions:
  contents: write

env:
  RELEASE_TAG: maps-v4

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # KEEP YOUR EXISTING MAP BUILD STEPS HERE.
      #
      # They must produce the newly-built *.abm files in ./dist/
      # before the "Download existing release assets" step below.
      # ============================================================

      - name: Download existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf release-assets
          mkdir -p release-assets

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" \
              --dir release-assets \
              --pattern '*.abm' \
              --clobber || true

            gh release download "$RELEASE_TAG" \
              --dir release-assets \
              --pattern 'manifest.json' \
              --clobber || true
          fi

          echo "Existing release ABM files:"
          find release-assets -maxdepth 1 -type f -name '*.abm' \
            -printf '%f\n' | sort || true

      - name: Build fixed manifest
        run: |
          PREVIOUS_ARGS=()
          if [ -f release-assets/manifest.json ]; then
            PREVIOUS_ARGS+=(--previous-manifest release-assets/manifest.json)
          fi

          CURRENT_ARGS=()
          if [ -f dist/manifest.json ]; then
            CURRENT_ARGS+=(--current-manifest dist/manifest.json)
          fi

          python build_release_manifest.py \
            "${PREVIOUS_ARGS[@]}" \
            "${CURRENT_ARGS[@]}" \
            --asset-dir release-assets \
            --output dist/manifest.json \
            --release-tag "$RELEASE_TAG"

      - name: Assemble complete release
        run: |
          rm -rf final-assets
          mkdir -p final-assets

          # Keep every old country.
          find release-assets -maxdepth 1 -type f -name '*.abm' \
            -exec cp {} final-assets/ \; || true

          # Replace/add only the countries rebuilt in this run.
          find dist -maxdepth 1 -type f -name '*.abm' \
            -exec cp {} final-assets/ \;

          cp dist/manifest.json final-assets/manifest.json

          echo "Final release:"
          ls -lh final-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              final-assets/*.abm \
              final-assets/manifest.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              final-assets/*.abm \
              final-assets/manifest.json \
              --title "ABM v4 offline map data" \
              --notes "ABM v4 offline map data"
          fi
