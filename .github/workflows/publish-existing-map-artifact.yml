name: Publish existing map artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions run ID that already contains the built map artifact'
        required: true
        default: '92010749164'
        type: string
      artifact_name:
        description: 'Artifact name to publish'
        required: true
        default: 'map-dist-0'
        type: string
      release_tag:
        description: 'Release tag to publish to'
        required: true
        default: 'maps-v3'
        type: string

permissions:
  contents: write

env:
  RUN_ID: ${{ inputs.run_id }}
  ARTIFACT_NAME: ${{ inputs.artifact_name }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  publish:
    name: Publish already-built map (no rebuild)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download existing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact release-dist
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D artifact
          echo 'Downloaded files:'
          find artifact -type f -maxdepth 3 -printf '%p %s bytes\n'
          test -n "$(find artifact -type f -name '*.abm' -print -quit)" || { echo 'No .abm file found in existing artifact' >&2; exit 1; }

      - name: Prepare release files
        run: |
          set -euo pipefail
          find artifact -type f \( -name '*.abm' -o -name 'manifest.json' -o -name 'build-report.json' -o -name '*.patch.json' -o -name '*.patch.bin' \) -exec cp -f {} release-dist/ \;
          echo 'Release files:'
          ls -lh release-dist
          test -n "$(find release-dist -maxdepth 1 -type f -name '*.abm' -print -quit)"

      - name: Verify existing ABM without rebuilding
        run: |
          set -euo pipefail
          chmod +x tool/maps/*.py tool/maps/*.sh || true
          shopt -s nullglob
          files=(release-dist/*.abm)
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do
            code="$(basename "$f" .abm)"
            python3 tool/maps/verify_abm_container.py "$f" --region "$code" >/dev/null
            echo "Verified: $f"
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --title 'Abtin Offline Maps' \
              --notes 'Published from an already-built GitHub Actions artifact; no map rebuild was performed.'
          fi
          files=(release-dist/*.abm)
          shopt -s nullglob
          files+=(release-dist/manifest.json release-dist/build-report.json release-dist/*.patch.json release-dist/*.patch.bin)
          existing=()
          for f in "${files[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          test "${#existing[@]}" -gt 0
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "${existing[@]}" --clobber
          echo "Published existing artifact to release $RELEASE_TAG"
