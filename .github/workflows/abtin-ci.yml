name: Abtin Distribution CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: abtin
          POSTGRES_USER: abtin
          POSTGRES_PASSWORD: abtin
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U abtin -d abtin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      USE_SQLITE: "0"
      DB_HOST: 127.0.0.1
      DB_NAME: abtin
      DB_USER: abtin
      DB_PASSWORD: abtin
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      REDIS_URL: redis://127.0.0.1:6379/1
      SEED_DEFAULT_PASSWORD: Demo-Strong-Password-2026!
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Django checks and migrations
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
      - name: Seed demo data
        run: python manage.py seed_demo_data --password "$SEED_DEFAULT_PASSWORD"
      - name: Backend smoke tests
        run: |
          python security_smoke.py
          python smoke_phase6_complete.py
          python smoke_phase7.py
      - name: Start API and run HTTP smoke test
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 >/tmp/abtin-api.log 2>&1 &
          api_ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/schema/ >/dev/null; then api_ready=1; break; fi
            sleep 2
          done
          if [ "$api_ready" -ne 1 ]; then
            echo 'API did not become ready. Server log:'
            cat /tmp/abtin-api.log
            exit 1
          fi
          python smoke_rebuild.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config
      - name: Build images
        run: docker compose build
