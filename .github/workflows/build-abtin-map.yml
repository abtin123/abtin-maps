name: Build Abtin Map

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'کدهای کشور جدا شده با کاما (مثلا IR,TR,IQ) یا all برای همه'
        required: false
        default: 'all'
      force_rebuild:
        description: 'کدهای کشور که صرف‌نظر از تاریخ دوباره ساخته شوند، یا all'
        required: false
        default: ''
      release_tag:
        description: 'تگ ریلیز مقصد'
        required: false
        default: 'maps-v1'
  schedule:
    - cron: '0 2 * * 1'   # هر دوشنبه ساعت 02:00 UTC
    # - cron: '0 2 1 * *' # ماهانه (این خط را فعال و خط بالا را کامنت کنید)

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'maps-v1' }}

jobs:
  # ------------------------------------------------------------------
  # فقط در اجرای زمان‌بندی‌شده: چک می‌کند کدام کشورها داده‌ی تازه‌تر دارند
  # ------------------------------------------------------------------
  check-updates:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for updates
        id: check
        run: |
          python3 tools/check_updates.py \
            --state tools/build_state.json \
            --force "${{ github.event.inputs.force_rebuild }}" \
            --out-changed changed.txt \
            --out-state-new state_new.json
          echo "changed=$(cat changed.txt)" >> "$GITHUB_OUTPUT"

      - name: Save new state
        uses: actions/upload-artifact@v4
        with:
          name: build-state-new
          path: state_new.json

  # ------------------------------------------------------------------
  # ساخت ماتریس کشورهایی که باید ساخته شوند
  # ------------------------------------------------------------------
  plan:
    needs: [check-updates]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_countries: ${{ steps.plan.outputs.has_countries }}
    steps:
      - uses: actions/checkout@v4

      - name: Build matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ needs.check-updates.outputs.changed }}
          INPUT_COUNTRIES: ${{ github.event.inputs.countries }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          event = os.environ.get("EVENT_NAME")
          changed = os.environ.get("CHANGED", "")
          input_countries = (os.environ.get("INPUT_COUNTRIES") or "all").strip()
          force = (os.environ.get("FORCE_REBUILD") or "").strip()

          with open("tools/countries.json", encoding="utf-8") as f:
              all_countries = json.load(f)["countries"]
          all_codes = {c["code"] for c in all_countries}

          if event == "schedule":
              codes = [c.strip().upper() for c in changed.split(",") if c.strip()]
          elif force.strip().lower() == "all" or input_countries.lower() == "all":
              codes = list(all_codes)
          else:
              codes = [c.strip().upper() for c in input_countries.split(",") if c.strip()]

          codes = sorted({c for c in codes if c in all_codes})
          matrix = {"country": [c for c in all_countries if c["code"] in codes]}

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
              out.write(f"has_countries={'true' if codes else 'false'}\n")

          print("کشورهای انتخاب‌شده:", codes or "(هیچ‌کدام)")
          PYEOF

  # ------------------------------------------------------------------
  # برای هر کشور یک job موازی و مستقل (حداکثر ۴ همزمان)
  # ------------------------------------------------------------------
  build:
    needs: [plan]
    if: needs.plan.outputs.has_countries == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install osmium zstandard

      - name: Download source pbf
        run: |
          mkdir -p src
          curl -L --fail --retry 3 --retry-delay 5 \
            -o "src/${{ matrix.country.code }}.osm.pbf" \
            "${{ matrix.country.pbf_url }}"

      - name: Build .abm
        run: |
          mkdir -p out
          python3 tools/abtinmap_build.py "src/${{ matrix.country.code }}.osm.pbf" \
            -o "out/${{ matrix.country.code }}.abm" \
            --region "${{ matrix.country.code }}"

      - name: Validate output
        run: python3 tools/abtinmap_inspect.py "out/${{ matrix.country.code }}.abm"

      - name: Make manifest
        run: |
          python3 tools/make_manifest.py "out/${{ matrix.country.code }}.abm" \
            --code "${{ matrix.country.code }}" \
            --name-fa "${{ matrix.country.name_fa }}" \
            --name-en "${{ matrix.country.name_en }}" \
            --out-dir out \
            --release-tag "${{ env.RELEASE_TAG }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.country.code }}
          path: |
            out/${{ matrix.country.code }}.abm
            out/${{ matrix.country.code }}.abm.part*
            out/manifest-${{ matrix.country.code }}.json
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # جمع‌آوری artifact ها، ادغام manifest، انتشار ریلیز مشترک
  # ------------------------------------------------------------------
  release:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: merged

      - name: Fetch previous manifest (کشورهای ساخته‌نشده در این اجرا دست‌نخورده بمانند)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          mkdir -p merged/prev-release
          curl -L --fail -o merged/prev-release/manifest.json \
            "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/manifest.json" || true
          if [ -s merged/prev-release/manifest.json ]; then
            python3 - <<'PYEOF'
          import json, os
          with open("merged/prev-release/manifest.json", encoding="utf-8") as f:
              m = json.load(f)
          for c in m.get("countries", []):
              with open(f"merged/prev-release/manifest-{c['code']}.json", "w", encoding="utf-8") as out:
                  json.dump(c, out, ensure_ascii=False, indent=2)
          os.remove("merged/prev-release/manifest.json")
          PYEOF
          fi

      - name: Merge manifests
        run: |
          mkdir -p out
          python3 tools/merge_manifests.py --in-dir merged --out out/manifest.json \
            --release-tag "${{ env.RELEASE_TAG }}"

      - name: Collect release assets
        run: |
          mkdir -p release_assets
          find merged -type f \( -name "*.abm" -o -name "*.abm.part*" \) -exec cp {} release_assets/ \;
          cp out/manifest.json release_assets/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release_assets/*
          fail_on_unmatched_files: false

  # ------------------------------------------------------------------
  # فقط در اجرای زمان‌بندی‌شده: ذخیره‌ی تاریخ آخرین ساخت موفق در ریپو
  # ------------------------------------------------------------------
  update-state:
    needs: [check-updates, release]
    if: always() && github.event_name == 'schedule' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-state-new

      - name: Commit updated build_state.json
        run: |
          cp state_new.json tools/build_state.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/build_state.json
          git commit -m "chore: update build_state.json [skip ci]" || echo "چیزی برای کامیت نبود"
          git push
