name: Build Abtin Map

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'کدهای کشور با کاما (مثلا IR,TR,IQ) یا all برای همه'
        required: false
        default: 'IR'
      release_tag:
        description: 'تگ ریلیز مقصد'
        required: false
        default: 'maps-v1'
      force_rebuild:
        description: 'ساخت اجباری صرف‌نظر از تاریخ منبع (کدها با کاما یا all)'
        required: false
        default: ''
  schedule:
    # هر دوشنبه ۰۲:۰۰ UTC — فقط کشورهایی که داده‌شان تازه شده بازسازی می‌شوند
    - cron: '0 2 * * 1'
    # ماهانه به‌جای هفتگی:  - cron: "0 2 1 * *"

permissions:
  contents: write

concurrency:
  group: abtin-map-build
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'maps-v1' }}

jobs:
  # ---------------------------------------------------------------- plan ----
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
      state: ${{ steps.changed.outputs.state }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # در اجرای زمان‌بندی‌شده، فقط کشورهای دارای داده‌ی تازه انتخاب می‌شوند
      - name: بررسی به‌روزرسانی منابع Geofabrik
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 tools/check_updates.py \
              --countries tools/countries.json \
              --state tools/build_state.json \
              --force "${{ github.event.inputs.force_rebuild }}" \
              --out-changed changed.txt \
              --out-state-new state_new.json
            echo "codes=$(cat changed.txt)" >> "$GITHUB_OUTPUT"
          else
            IN="${{ github.event.inputs.countries }}"
            [ -z "$IN" ] && IN="all"
            echo "codes=$IN" >> "$GITHUB_OUTPUT"
            cp tools/build_state.json state_new.json 2>/dev/null || echo '{}' > state_new.json
          fi
          echo "state=$(python3 -c "import json,sys;print(json.dumps(json.load(open('state_new.json'))))")" >> "$GITHUB_OUTPUT"

      - name: ساخت ماتریس کشورها
        id: build-matrix
        env:
          CODES: ${{ steps.changed.outputs.codes }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          codes = (os.environ.get("CODES") or "").strip()
          data = json.load(open("tools/countries.json", encoding="utf-8"))["countries"]
          if codes.lower() in ("", "all"):
              sel = data
          else:
              want = {c.strip().upper() for c in codes.split(",") if c.strip()}
              sel = [c for c in data if c["code"].upper() in want]
              missing = want - {c["code"].upper() for c in sel}
              if missing:
                  print(f"::warning::کد ناشناخته در countries.json: {sorted(missing)}")
          matrix = {"include": [
              {"code": c["code"], "name_fa": c["name_fa"],
               "name_en": c["name_en"], "pbf_url": c["pbf_url"]} for c in sel]}
          print("matrix=" + json.dumps(matrix, ensure_ascii=False))
          print("count=" + str(len(sel)))
          PY

      - name: خلاصه
        run: |
          echo "کشورهای انتخاب‌شده: ${{ steps.build-matrix.outputs.count }}" >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------------------- build ----
  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب وابستگی‌ها
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-program-options-dev libexpat1-dev zlib1g-dev libbz2-dev
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet osmium zstandard

      - name: آزادسازی فضای دیسک
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: دانلود PBF (${{ matrix.code }})
        run: |
          mkdir -p src out
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "src/${{ matrix.code }}.osm.pbf" "${{ matrix.pbf_url }}"
          ls -lh "src/${{ matrix.code }}.osm.pbf"

      - name: ساخت ABTINMAP
        run: |
          python3 tools/abtinmap_build.py "src/${{ matrix.code }}.osm.pbf" \
            -o "out/${{ matrix.code }}.abm" \
            --region "${{ matrix.code }}" \
            --tmpdir "${RUNNER_TEMP}"
          rm -f "src/${{ matrix.code }}.osm.pbf"
          ls -lh out/

      - name: اعتبارسنجی خروجی
        run: python3 tools/abtinmap_inspect.py "out/${{ matrix.code }}.abm"

      - name: ساخت manifest تک‌کشوره + تکه‌کردن فایل
        run: |
          python3 tools/make_manifest.py "out/${{ matrix.code }}.abm" \
            --code "${{ matrix.code }}" \
            --name-fa "${{ matrix.name_fa }}" \
            --name-en "${{ matrix.name_en }}" \
            --out-dir out \
            --release-tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}"
          # اگر فایل تکه شده، نسخه‌ی یکپارچه لازم نیست آپلود شود
          if ls out/${{ matrix.code }}.abm.part0 >/dev/null 2>&1; then
            rm -f "out/${{ matrix.code }}.abm"
          fi
          ls -lh out/

      - name: آپلود artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.code }}
          path: out/*
          retention-days: 3
          compression-level: 0

  # ------------------------------------------------------------- release ----
  release:
    needs: [plan, build]
    if: always() && needs.plan.outputs.count != '0' && contains(needs.build.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: دریافت artifact های همه‌ی کشورها
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: map-*

      - name: خواندن manifest ریلیز قبلی (برای حفظ کشورهای دست‌نخورده)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p merged/prev-manifest
          if gh release download "${RELEASE_TAG}" --pattern manifest.json --dir prevdl 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          m = json.load(open("prevdl/manifest.json", encoding="utf-8"))
          os.makedirs("merged/prev-manifest", exist_ok=True)
          for c in m.get("countries", []):
              with open(f"merged/prev-manifest/manifest-{c['code']}.json", "w", encoding="utf-8") as f:
                  json.dump(c, f, ensure_ascii=False, indent=2)
          print(f"{len(m.get('countries', []))} کشور از ریلیز قبلی حفظ شد")
          PY
          else
            echo "ریلیز قبلی یافت نشد — manifest از صفر ساخته می‌شود"
          fi

      - name: ادغام manifest ها
        run: |
          mkdir -p out
          python3 tools/merge_manifests.py \
            --in-dir merged \
            --out out/manifest.json \
            --release-tag "${RELEASE_TAG}"
          find merged -type f \( -name '*.abm' -o -name '*.abm.part*' \) -exec mv -t out/ {} +
          ls -lh out/

      - name: انتشار در ریلیز
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Abtin Maps ${{ env.RELEASE_TAG }}
          body: |
            نقشه‌های آفلاین ABTINMAP v1
            manifest: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/manifest.json
          files: out/*
          fail_on_unmatched_files: true
          make_latest: true

      - name: ثبت وضعیت ساخت در ریپو
        if: github.event_name == 'schedule'
        run: |
          cat > tools/build_state.json <<'JSON'
          ${{ needs.plan.outputs.state }}
          JSON
          python3 -c "import json;json.dump(json.load(open('tools/build_state.json')),open('tools/build_state.json','w'),ensure_ascii=False,indent=2)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/build_state.json
          git diff --staged --quiet || (git commit -m "chore: update build_state after map build" && git push)

      - name: خلاصه
        run: |
          echo "### ریلیز \`${RELEASE_TAG}\` منتشر شد" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          m=json.load(open('out/manifest.json',encoding='utf-8'))
          print('| کشور | حجم | فایل‌ها |'); print('|---|---|---|')
          for c in m['countries']:
              print(f\"| {c['name_fa']} ({c['code']}) | {c['total_size']/1e6:.0f} MB | {len(c['files'])} |\")
          " >> $GITHUB_STEP_SUMMARY
