name: Build Abtin Map

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'کدهای کشور با کاما (مثلا IR,TR,IQ) یا all برای همه'
        required: false
        default: 'IR'
      release_tag:
        description: 'تگ ریلیز مقصد'
        required: false
        default: 'maps-v1'
      force_rebuild:
        description: 'ساخت اجباری صرف‌نظر از تاریخ منبع (کدها با کاما یا all)'
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

concurrency:
  group: abtin-map-build
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'maps-v1' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
      state: ${{ steps.changed.outputs.state }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: بررسی به‌روزرسانی منابع Geofabrik
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # دریافت لیست فایل‌های موجود در ریلیز برای بررسی هوشمند
          echo "دریافت لیست فایل‌های ریلیز..."
          EXISTING_FILES=""
          if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' > existing_assets.txt 2>/dev/null; then
             EXISTING_FILES=$(cat existing_assets.txt)
          fi
          # ذخیره لیست در خروجی برای استفاده در مرحله بعد
          echo "existing_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$EXISTING_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 tools/check_updates.py \
              --countries tools/countries.json \
              --state tools/build_state.json \
              --force "${{ github.event.inputs.force_rebuild }}" \
              --out-changed changed.txt \
              --out-state-new state_new.json
            echo "codes=$(cat changed.txt)" >> "$GITHUB_OUTPUT"
          else
            IN="${{ github.event.inputs.countries }}"
            [ -z "$IN" ] && IN="all"
            echo "codes=$IN" >> "$GITHUB_OUTPUT"
            cp tools/build_state.json state_new.json 2>/dev/null || echo '{}' > state_new.json
          fi
          echo "state=$(python3 -c "import json,sys;print(json.dumps(json.load(open('state_new.json'))))")" >> "$GITHUB_OUTPUT"

      - name: ساخت ماتریس کشورها (با فیلتر هوشمند)
        id: build-matrix
        env:
          CODES: ${{ steps.changed.outputs.codes }}
          FORCE: ${{ github.event.inputs.force_rebuild }}
          EXISTING_FILES: ${{ steps.changed.outputs.existing_files }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          
          codes = (os.environ.get("CODES") or "").strip()
          force = (os.environ.get("FORCE") or "").strip()
          existing_files_str = os.environ.get("EXISTING_FILES") or ""
          existing_set = set(existing_files_str.splitlines())
          
          data = json.load(open("tools/countries.json", encoding="utf-8"))["countries"]
          
          # لیست اولیه کشورها
          if codes.lower() in ("", "all"):
              candidates = data
          else:
              want = {c.strip().upper() for c in codes.split(",") if c.strip()}
              candidates = [c for c in data if c["code"].upper() in want]

          # --- منطق فیلتر کردن (اصلاح اصلی) ---
          sel = []
          skipped = []
          
          for c in candidates:
              code = c["code"].upper()
              
              # اگر Force فعال باشد، بدون شرط اضافه کن
              if force == "all" or force == code or (force and code in force.split(",")):
                  sel.append(c)
                  continue
              
              # اگر All بود، چک کن آیا فایلش در ریلیز هست؟
              # فرمت فایل‌ها معمولا CODE.abm یا CODE.abm.part0 است
              has_main = f"{code}.abm" in existing_set
              has_part = any(f.startswith(f"{code}.abm.part") for f in existing_set)
              
              if codes.lower() == "all" and (has_main or has_part):
                  skipped.append(code)
              else:
                  sel.append(c)

          if skipped:
              print(f"::notice::کشورهای رد شده (چون قبلا ساخته شده‌اند): {', '.join(skipped)}")

          # بسط دادن US
          US_REGIONS = [
              {"code": "US-NE", "name_fa": "ایالات متحده - شمال شرق", "name_en": "United States - Northeast", "pbf_url": "https://download.geofabrik.de/north-america/us-northeast-latest.osm.pbf"},
              {"code": "US-MW", "name_fa": "ایالات متحده - غرب میانه", "name_en": "United States - Midwest", "pbf_url": "https://download.geofabrik.de/north-america/us-midwest-latest.osm.pbf"},
              {"code": "US-SO", "name_fa": "ایالات متحده - جنوب", "name_en": "United States - South", "pbf_url": "https://download.geofabrik.de/north-america/us-south-latest.osm.pbf"},
              {"code": "US-WE", "name_fa": "ایالات متحده - غرب", "name_en": "United States - West", "pbf_url": "https://download.geofabrik.de/north-america/us-west-latest.osm.pbf"},
              {"code": "US-PA", "name_fa": "ایالات متحده - آلاسکا و هاوایی", "name_en": "United States - Pacific (Alaska & Hawaii)", "pbf_url": "https://download.geofabrik.de/north-america/us-pacific-latest.osm.pbf"},
          ]
          
          expanded = []
          for c in sel:
              if c["code"].upper() == "US":
                  expanded.extend(US_REGIONS)
              else:
                  expanded.append(c)
          
          sel = expanded
          
          matrix = {"include": [
              {"code": c["code"], "name_fa": c["name_fa"], 
               "name_en": c["name_en"], "pbf_url": c["pbf_url"]} for c in sel]}
               
          print("matrix=" + json.dumps(matrix, ensure_ascii=False))
          print("count=" + str(len(sel)))
          PY

      - name: خلاصه
        run: |
          echo "### 🗺️ برنامه ساخت" >> $GITHUB_STEP_SUMMARY
          echo "تعداد کشورهای انتخاب‌شده: **${{ steps.build-matrix.outputs.count }}**" >> $GITHUB_STEP_SUMMARY

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      -
