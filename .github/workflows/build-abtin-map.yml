name: Build Abtin Map (resumable checkpoints)

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'batch کشورها؛ توسط صف خودکار ساخته می‌شود، حداکثر 15 کد مانند IR,TR,IQ'
        required: true
        default: 'IR'
      release_tag:
        description: 'تگ Release نهایی موجود که فقط به‌روزرسانی می‌شود'
        required: true
        default: 'maps-v3'
      queue_id:
        description: 'شناسهٔ صف خودکار؛ برای اجرای دستی خالی بماند'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: abtin-map-build-checkpointed
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  CHECKPOINT_TAG_PREFIX: map-checkpoints-v2
  LEGACY_CHECKPOINT_TAG: map-checkpoints-v1
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      country_matrix: ${{ steps.matrix.outputs.country_matrix }}
      stage_matrix: ${{ steps.matrix.outputs.stage_matrix }}
      country_count: ${{ steps.matrix.outputs.country_count }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ساخت catalog رسمی Geofabrik
        run: |
          python3 tools/sync_geofabrik_catalog.py \
            --curated tools/countries.json \
            --out tools/countries.resolved.json

      - name: ساخت ماتریس کشورها و 16 checkpoint هر کشور
        id: matrix
        env:
          REQUESTED_COUNTRIES: ${{ inputs.countries }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          requested = (os.environ.get('REQUESTED_COUNTRIES') or '').strip()
          want = [item.strip().upper() for item in requested.split(',') if item.strip()]
          if not want:
              raise SystemExit('حداقل یک کد کشور لازم است')
          if any(item == 'ALL' for item in want):
              raise SystemExit('ALL مستقیماً در renderer اجرا نمی‌شود؛ workflow «Queue global OSM map updates» همهٔ کشورها را به batchهای 15تایی امن تقسیم می‌کند.')
          data = json.load(open('tools/countries.resolved.json', encoding='utf-8'))['countries']
          by_code = {str(item['code']).upper(): item for item in data}
          missing = [item for item in want if item not in by_code]
          if missing:
              raise SystemExit(f'کد ناشناخته: {", ".join(missing)}')
          selected = []
          seen = set()
          for code in want:
              if code not in seen:
                  selected.append(by_code[code])
                  seen.add(code)
          if len(selected) > 15:
              raise SystemExit('در هر اجرا حداکثر 15 کشور مجاز است؛ فهرست را به چند اجرای جدا تقسیم کنید.')
          countries = []
          stages = []
          for country in selected:
              base = {
                  'code': country['code'],
                  'name_fa': country['name_fa'],
                  'name_en': country['name_en'],
                  'pbf_url': country['pbf_url'],
                  'country_code': country.get('country_code', country['code'][:2]),
                  'country_name_fa': country.get('country_name_fa', country['name_fa']),
                  'country_name_en': country.get('country_name_en', country['name_en']),
                  'region_name_fa': country.get('region_name_fa', country['name_fa']),
                  'region_name_en': country.get('region_name_en', country['name_en']),
                  'group_order': int(country.get('group_order', 0)),
              }
              countries.append(base)
              for row in range(4):
                  for col in range(4):
                      stages.append({**base, 'stage': f'R{row:02d}C{col:02d}'})
          print('country_matrix=' + json.dumps({'include': countries}, ensure_ascii=False))
          print('stage_matrix=' + json.dumps({'include': stages}, ensure_ascii=False))
          print('country_count=' + str(len(countries)))
          PY

      - name: خلاصهٔ برنامهٔ ساخت
        run: |
          echo '### ساخت checkpoint‌دار' >> "$GITHUB_STEP_SUMMARY"
          echo "کشورها: **${{ steps.matrix.outputs.country_count }}**" >> "$GITHUB_STEP_SUMMARY"
          echo 'برای هر کشور 16 stage با یک renderer و یک worker WebP اجرا می‌شود.' >> "$GITHUB_STEP_SUMMARY"

  render_checkpoint:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.stage_matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-renderer.txt

      - name: نصب وابستگی‌ها و ابزار برش PBF
        run: |
          timeout 5m python3 -m pip install --disable-pip-version-check --upgrade pip
          timeout 12m python3 -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-renderer.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: ساخت catalog همان کشور
        run: |
          python3 tools/sync_geofabrik_catalog.py \
            --curated tools/countries.json \
            --only '${{ matrix.code }}' \
            --out countries.resolved.json

      - name: بازیابی checkpoint همان کشور از Release داخلی
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: map-checkpoints-v2-${{ matrix.code }}
          LEGACY_CHECKPOINT_TAG: map-checkpoints-v1
        run: |
          set -euo pipefail
          mkdir -p checkpoints resume
          asset='${{ matrix.code }}-${{ matrix.stage }}.tar'
          if ! gh release download "${CHECKPOINT_TAG}" --pattern "${asset}" --dir resume; then
            if [ '${{ matrix.code }}' = 'IR' ]; then
              gh release download "${LEGACY_CHECKPOINT_TAG}" --pattern "${asset}" --dir resume || true
            fi
          fi
          if [ -f "resume/${asset}" ]; then
            tar -xf "resume/${asset}" -C checkpoints
            echo "checkpoint بازیابی شد: ${asset}"
          else
            echo "checkpoint قبلی وجود ندارد؛ فقط همین stage ساخته می‌شود: ${asset}"
          fi

      - name: رندر یک stage و ثبت checkpoint (${{ matrix.code }} / ${{ matrix.stage }})
        run: |
          set -euo pipefail
          python3 tools/checkpoint_render.py \
            --catalog countries.resolved.json \
            --code '${{ matrix.code }}' \
            --stage '${{ matrix.stage }}' \
            --checkpoint-dir checkpoints \
            --source-dir src \
            --out-dir out
          test -f "checkpoints/${{ matrix.code }}/stages/${{ matrix.stage }}/complete.json"
          tar -C checkpoints -cf '${{ matrix.code }}-${{ matrix.stage }}.tar' \
            '${{ matrix.code }}/stages/${{ matrix.stage }}'

      - name: ذخیرهٔ checkpoint در Release اختصاصی همان کشور
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: map-checkpoints-v2-${{ matrix.code }}
        run: |
          set -euo pipefail
          if ! gh release view "${CHECKPOINT_TAG}" >/dev/null 2>&1; then
            gh release create "${CHECKPOINT_TAG}" \
              --title "Abtin Maps checkpoint: ${{ matrix.code }}" \
              --notes 'Checkpointهای قابل‌بازیابی همان کشور؛ برای نصب کاربر نیستند.'
          fi
          gh release upload "${CHECKPOINT_TAG}" \
            '${{ matrix.code }}-${{ matrix.stage }}.tar' --clobber

      - name: گزارش منابع stage
        if: always()
        run: |
          echo '### منابع runner' >> "$GITHUB_STEP_SUMMARY"
          free -h | tee -a "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

  assemble_country:
    needs: [plan, render_checkpoint]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.country_matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-renderer.txt

      - name: نصب وابستگی‌ها
        run: |
          timeout 5m python3 -m pip install --disable-pip-version-check --upgrade pip
          timeout 12m python3 -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-renderer.txt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: ساخت catalog همان کشور
        run: |
          python3 tools/sync_geofabrik_catalog.py \
            --curated tools/countries.json \
            --only '${{ matrix.code }}' \
            --out countries.resolved.json

      - name: دریافت 16 checkpoint کامل همان کشور
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: map-checkpoints-v2-${{ matrix.code }}
          LEGACY_CHECKPOINT_TAG: map-checkpoints-v1
        run: |
          set -euo pipefail
          mkdir -p resume checkpoints
          if ! gh release download "${CHECKPOINT_TAG}" --pattern '${{ matrix.code }}-R??C??.tar' --dir resume; then
            if [ '${{ matrix.code }}' = 'IR' ]; then
              gh release download "${LEGACY_CHECKPOINT_TAG}" --pattern '${{ matrix.code }}-R??C??.tar' --dir resume
            else
              echo "checkpointهای ${{ matrix.code }} کامل نیستند؛ به render_checkpoint برمی‌گردد." >&2
              exit 1
            fi
          fi
          count=$(find resume -name '${{ matrix.code }}-R??C??.tar' -type f | wc -l)
          test "$count" -eq 16
          for checkpoint in resume/*.tar; do
            tar -xf "$checkpoint" -C checkpoints
          done

      - name: ادغام checkpointها به atlas نهایی
        run: |
          python3 tools/checkpoint_render.py \
            --catalog countries.resolved.json \
            --code '${{ matrix.code }}' \
            --checkpoint-dir checkpoints \
            --out-dir atlas \
            --merge
          test -s 'atlas/${{ matrix.code }}.amap'
          test -s 'atlas/rendered-${{ matrix.code }}.json'

      - name: ساخت ABM با atlas آماده، بدون رندر مجدد
        run: |
          python3 tools/build_country_package.py \
            --catalog countries.resolved.json \
            --code '${{ matrix.code }}' \
            --out-dir out --source-dir src \
            --prebuilt-atlas 'atlas/${{ matrix.code }}.amap' \
            --release-tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}"
          python3 tools/abtinmap_inspect.py 'out/${{ matrix.code }}.abm'

      - name: دریافت نسخهٔ قبلی و ساخت پچ افزایشی
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download "${RELEASE_TAG}" --pattern '${{ matrix.code }}.abm' --dir prev || true
          if [ -s 'prev/${{ matrix.code }}.abm' ]; then
            python3 tools/abtinmap_diff.py \
              'prev/${{ matrix.code }}.abm' 'out/${{ matrix.code }}.abm' \
              --code '${{ matrix.code }}' --out-dir out
          fi

      - name: ساخت manifest نهایی و تکه‌کردن فایل در صورت لزوم
        run: |
          PATCH_ARG=''
          if [ -f 'out/patch-${{ matrix.code }}.json' ]; then
            PATCH_ARG='--patch-json out/patch-${{ matrix.code }}.json'
          fi
          python3 tools/make_manifest.py 'out/${{ matrix.code }}.abm' \
            --code '${{ matrix.code }}' \
            --name-fa '${{ matrix.name_fa }}' \
            --name-en '${{ matrix.name_en }}' \
            --country-code '${{ matrix.country_code }}' \
            --country-name-fa '${{ matrix.country_name_fa }}' \
            --country-name-en '${{ matrix.country_name_en }}' \
            --region-name-fa '${{ matrix.region_name_fa }}' \
            --region-name-en '${{ matrix.region_name_en }}' \
            --group-order '${{ matrix.group_order }}' \
            --out-dir out \
            --release-tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --rendered-meta 'atlas/rendered-${{ matrix.code }}.json' \
            --source-url '${{ matrix.pbf_url }}' \
            --source-provider 'Geofabrik / OpenStreetMap' \
            --source-attribution 'Map data from OpenStreetMap, ODbL 1.0' \
            --source-license-url 'https://opendatacommons.org/licenses/odbl/1.0/' \
            --source-copyright-url 'https://www.openstreetmap.org/copyright' \
            $PATCH_ARG
          if [ -f 'out/${{ matrix.code }}.abm.part0' ]; then
            rm -f 'out/${{ matrix.code }}.abm'
          fi

      - name: بارگذاری خروجی کشور برای job انتشار
        uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.code }}
          path: out/*
          retention-days: 3
          compression-level: 0

      - name: بارگذاری وضعیت رشته‌ها
        uses: actions/upload-artifact@v4
        with:
          name: string-state-${{ matrix.code }}
          path: tools/string_state/${{ matrix.code }}.json
          if-no-files-found: ignore
          retention-days: 3

  release:
    needs: [plan, assemble_country]
    runs-on: ubuntu-latest
    if: needs.plan.outputs.country_count != '0' && needs.assemble_country.result == 'success'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: دریافت خروجی همهٔ کشورها
        uses: actions/download-artifact@v5
        with:
          path: merged
          pattern: map-*

      - name: دریافت manifest قبلی برای حفظ سایر کشورها
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p merged/prev-manifest previous
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release download "${RELEASE_TAG}" --pattern manifest.json --dir previous
            python3 tools/extract_manifest_countries.py \
              --input previous/manifest.json \
              --out-dir merged/prev-manifest
          else
            echo "Release قبلی وجود ندارد؛ manifest از کشورهای همین batch ساخته می‌شود."
          fi

      - name: ادغام manifestها و آماده‌سازی assets
        run: |
          mkdir -p out
          python3 tools/merge_manifests.py \
            --in-dir merged --out out/manifest.json --release-tag "${RELEASE_TAG}"
          find merged -type f \( -name '*.abm' -o -name '*.abm.part*' -o -name '*.abmpatch' -o -name 'patch-*.json' \) \
            -exec mv -t out/ {} +
          ls -lh out/

      - name: به‌روزرسانی Release نهایی بدون ساخت Release جدید
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "Abtin Maps ${RELEASE_TAG}" \
              --notes 'نقشه‌های آفلاین ABTINMAP؛ ساخته‌شده با checkpoint قابل‌بازیابی.'
          fi
          gh release upload "${RELEASE_TAG}" out/* --clobber

      - name: دریافت وضعیت رشته‌های کشورها
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          path: string-state-merged
          pattern: string-state-*
          merge-multiple: true

      - name: ثبت fingerprint OSM فقط پس از انتشار موفق
        continue-on-error: true
        run: |
          python3 tools/update_osm_source_state.py \
            --codes '${{ inputs.countries }}' \
            --state tools/osm_source_state.json
          cp tools/osm_source_state.json /tmp/osm_source_state.json

      - name: commit وضعیت منابع و رشته‌ها بدون خطای non-fast-forward
        run: |
          set -euo pipefail
          HAS_STRINGS="$(find string-state-merged -type f -name '*.json' -print -quit 2>/dev/null || true)"
          HAS_OSM_STATE=''
          if [ -f /tmp/osm_source_state.json ]; then
            HAS_OSM_STATE=1
          fi
          if [ -z "${HAS_STRINGS}" ] && [ -z "${HAS_OSM_STATE}" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            if [ -n "${HAS_STRINGS}" ]; then
              mkdir -p tools/string_state
              cp string-state-merged/*.json tools/string_state/
            fi
            if [ -n "${HAS_OSM_STATE}" ]; then
              cp /tmp/osm_source_state.json tools/osm_source_state.json
            fi
            git add tools/string_state/ tools/osm_source_state.json
            if git diff --staged --quiet; then
              exit 0
            fi
            git commit -m 'chore: update map source state'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep "${attempt}"
          done
          echo 'ثبت وضعیت منابع پس از 3 تلاش ناموفق بود.' >&2
          exit 1

      - name: پیش‌برد صف و شروع batch بعدی
        if: ${{ inputs.queue_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="$(python3 tools/map_build_queue.py --complete --queue-id '${{ inputs.queue_id }}')"
          echo "${output}"
          cp tools/map_build_queue.json /tmp/map_build_queue_next.json
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/map_build_queue_next.json tools/map_build_queue.json
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add tools/map_build_queue.json
            if git diff --staged --quiet; then
              break
            fi
            git commit -m 'chore: advance map build queue'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            sleep "${attempt}"
          done
          if grep -q '^has_active=true$' <<<"${output}"; then
            next_countries="$(sed -n 's/^countries=//p' <<<"${output}")"
            next_queue_id="$(sed -n 's/^queue_id=//p' <<<"${output}")"
            gh workflow run build-abtin-map.yml \
              --ref "${GITHUB_REF_NAME}" \
              -f countries="${next_countries}" \
              -f release_tag="${RELEASE_TAG}" \
              -f queue_id="${next_queue_id}"
          fi

      - name: خلاصهٔ انتشار
        run: |
          echo "### انتشار ${RELEASE_TAG} کامل شد" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json; m=json.load(open('out/manifest.json', encoding='utf-8')); print(f'کشورهای موجود در manifest: {len(m[\"countries\"])}')" >> "$GITHUB_STEP_SUMMARY"
