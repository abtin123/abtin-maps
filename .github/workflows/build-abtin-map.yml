name: Build Abtin Map

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'کدهای کشور با کاما (مثلا IR,TR,IQ) یا all برای همه'
        required: false
        default: 'IR'
      release_tag:
        description: 'تگ ریلیز مقصد'
        required: false
        default: 'maps-v1'
      force_rebuild:
        description: 'ساخت اجباری صرف‌نظر از تاریخ منبع (کدها با کاما یا all)'
        required: false
        default: ''
  schedule:
    # هر دوشنبه ۰۲:۰۰ UTC — فقط کشورهایی که داده‌شان تازه شده بازسازی می‌شوند
    - cron: '0 2 * * 1'
    # ماهانه به‌جای هفتگی:  - cron: "0 2 1 * *"

permissions:
  contents: write

concurrency:
  group: abtin-map-build
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'maps-v1' }}

jobs:
  # ---------------------------------------------------------------- plan ----
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
      state: ${{ steps.changed.outputs.state }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # در اجرای زمان‌بندی‌شده، فقط کشورهای دارای داده‌ی تازه انتخاب می‌شوند
      - name: بررسی به‌روزرسانی منابع Geofabrik
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 tools/check_updates.py \
              --countries tools/countries.json \
              --state tools/build_state.json \
              --force "${{ github.event.inputs.force_rebuild }}" \
              --out-changed changed.txt \
              --out-state-new state_new.json
            echo "codes=$(cat changed.txt)" >> "$GITHUB_OUTPUT"
          else
            IN="${{ github.event.inputs.countries }}"
            [ -z "$IN" ] && IN="all"
            echo "codes=$IN" >> "$GITHUB_OUTPUT"
            cp tools/build_state.json state_new.json 2>/dev/null || echo '{}' > state_new.json
          fi
          echo "state=$(python3 -c "import json,sys;print(json.dumps(json.load(open('state_new.json'))))")" >> "$GITHUB_OUTPUT"

      - name: ساخت ماتریس کشورها
        id: build-matrix
        env:
          CODES: ${{ steps.changed.outputs.codes }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          codes = (os.environ.get("CODES") or "").strip()
          data = json.load(open("tools/countries.json", encoding="utf-8"))["countries"]
          if codes.lower() in ("", "all"):
              sel = data
          else:
              want = {c.strip().upper() for c in codes.split(",") if c.strip()}
              sel = [c for c in data if c["code"].upper() in want]
              missing = want - {c["code"].upper() for c in sel}
              if missing:
                  print(f"::warning::کد ناشناخته در countries.json: {sorted(missing)}")

          # ایالات متحده (~11 گیگ) روی runner استاندارد گیت‌هاب (سقف سخت‌افزاری
          # ۶ ساعت اجرا) هیچ‌وقت کامل نمی‌شود. به‌جای دانلود us-latest.osm.pbf
          # یکجا، به ۵ منطقه‌ی سرشماری (census region) که Geofabrik از قبل
          # جدا کلیپ کرده تقسیمش می‌کنیم؛ هرکدام یک matrix job جدا و کاملا
          # زیر محدودیت زمانی می‌شود. هر منطقه در manifest نهایی یک کد
          # جداگانه می‌گیرد (US-NE, US-MW, US-SO, US-WE, US-PA).
          US_REGIONS = [
              {"code": "US-NE", "name_fa": "ایالات متحده - شمال شرق",
               "name_en": "United States - Northeast",
               "pbf_url": "https://download.geofabrik.de/north-america/us-northeast-latest.osm.pbf"},
              {"code": "US-MW", "name_fa": "ایالات متحده - غرب میانه",
               "name_en": "United States - Midwest",
               "pbf_url": "https://download.geofabrik.de/north-america/us-midwest-latest.osm.pbf"},
              {"code": "US-SO", "name_fa": "ایالات متحده - جنوب",
               "name_en": "United States - South",
               "pbf_url": "https://download.geofabrik.de/north-america/us-south-latest.osm.pbf"},
              {"code": "US-WE", "name_fa": "ایالات متحده - غرب",
               "name_en": "United States - West",
               "pbf_url": "https://download.geofabrik.de/north-america/us-west-latest.osm.pbf"},
              {"code": "US-PA", "name_fa": "ایالات متحده - آلاسکا و هاوایی",
               "name_en": "United States - Pacific (Alaska & Hawaii)",
               "pbf_url": "https://download.geofabrik.de/north-america/us-pacific-latest.osm.pbf"},
          ]
          expanded = []
          for c in sel:
              if c["code"].upper() == "US":
                  expanded.extend(US_REGIONS)
              else:
                  expanded.append(c)
          sel = expanded

          matrix = {"include": [
              {"code": c["code"], "name_fa": c["name_fa"],
               "name_en": c["name_en"], "pbf_url": c["pbf_url"]} for c in sel]}
          print("matrix=" + json.dumps(matrix, ensure_ascii=False))
          print("count=" + str(len(sel)))
          PY

      - name: خلاصه
        run: |
          echo "کشورهای انتخاب‌شده: ${{ steps.build-matrix.outputs.count }}" >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------------------- build ----
  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب وابستگی‌ها
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-program-options-dev libexpat1-dev zlib1g-dev libbz2-dev
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet osmium zstandard

      - name: آزادسازی فضای دیسک
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: دانلود PBF (${{ matrix.code }})
        run: |
          mkdir -p src out
          FILE="src/${{ matrix.code }}.osm.pbf"
          URL="${{ matrix.pbf_url }}"
          # حداقل سایز منطقی برای یک فایل PBF واقعی. اگر geofabrik به‌خاطر
          # دانلود همزمان چند matrix job (rate-limit) یک صفحه‌ی کوچیک با
          # status 200 برگردونه، curl -f آن را موفق می‌بیند ولی فایل واقعی
          # نیست؛ این باعث خطای "invalid BlobHeader size" در مرحله‌ی build
          # می‌شود. اینجا با retry دستی و backoff تصادفی (که فشار همزمان
          # روی geofabrik را کم می‌کند) این مورد را جدا می‌گیریم.
          MIN_BYTES=200000
          ATTEMPT=1
          MAX_ATTEMPTS=6
          while :; do
            echo "تلاش دانلود $ATTEMPT/$MAX_ATTEMPTS برای ${{ matrix.code }}"
            rm -f "$FILE"
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
              -A "Mozilla/5.0 (compatible; AbtinMapBuilder/1.0)" \
              -o "$FILE" "$URL"
            SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            # فایل PBF واقعی هیچ‌وقت با '<' (HTML) یا '{' (JSON) شروع نمی‌شود
            if [ "$SIZE" -ge "$MIN_BYTES" ] && python3 -c "import sys; f=open('$FILE','rb'); h=f.read(1); sys.exit(1 if h in (b'<', b'{') else 0)"; then
              break
            fi
            echo "::warning::فایل دانلودشده برای ${{ matrix.code }} مشکوک است (سایز: ${SIZE} بایت) — احتمالا پاسخ rate-limit/خطای geofabrik به‌جای PBF واقعی"
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::دانلود PBF برای ${{ matrix.code }} بعد از $MAX_ATTEMPTS تلاش شکست خورد"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT+1))
            SLEEP=$(( (RANDOM % 60) + 30 * ATTEMPT ))
            echo "صبر $SLEEP ثانیه قبل از تلاش بعدی..."
            sleep "$SLEEP"
          done
          ls -lh "$FILE"

      - name: ساخت ABTINMAP
        run: |
          mkdir -p tools/string_state
          python3 tools/abtinmap_build.py "src/${{ matrix.code }}.osm.pbf" \
            -o "out/${{ matrix.code }}.abm" \
            --region "${{ matrix.code }}" \
            --tmpdir "${RUNNER_TEMP}" \
            --string-state "tools/string_state/${{ matrix.code }}.json"
          rm -f "src/${{ matrix.code }}.osm.pbf"
          ls -lh out/

      - name: اعتبارسنجی خروجی
        run: python3 tools/abtinmap_inspect.py "out/${{ matrix.code }}.abm"

      - name: دانلود نسخه‌ی قبلیِ همین کشور (برای پچ افزایشی)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download "${RELEASE_TAG}" \
            --pattern "${{ matrix.code }}.abm" --dir prev || true
          ls -lh prev/ 2>/dev/null || true

      - name: ساخت پچِ افزایشی (اگر نسخه‌ی قبلی موجود بود)
        if: hashFiles(format('prev/{0}.abm', matrix.code)) != ''
        continue-on-error: true
        run: |
          python3 tools/abtinmap_diff.py \
            "prev/${{ matrix.code }}.abm" "out/${{ matrix.code }}.abm" \
            --code "${{ matrix.code }}" --out-dir out
          rm -rf prev
          ls -lh "out/${{ matrix.code }}.abmpatch" "out/patch-${{ matrix.code }}.json" 2>/dev/null || true

      - name: ساخت manifest تک‌کشوره + تکه‌کردن فایل
        run: |
          PATCH_ARG=""
          if [ -f "out/patch-${{ matrix.code }}.json" ]; then
            PATCH_ARG="--patch-json out/patch-${{ matrix.code }}.json"
          fi
          python3 tools/make_manifest.py "out/${{ matrix.code }}.abm" \
            --code "${{ matrix.code }}" \
            --name-fa "${{ matrix.name_fa }}" \
            --name-en "${{ matrix.name_en }}" \
            --out-dir out \
            --release-tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            $PATCH_ARG
          # اگر فایل تکه شده، نسخه‌ی یکپارچه لازم نیست آپلود شود
          if ls out/${{ matrix.code }}.abm.part0 >/dev/null 2>&1; then
            rm -f "out/${{ matrix.code }}.abm"
          fi
          ls -lh out/

      - name: آپلود artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.code }}
          path: out/*
          retention-days: 3
          compression-level: 0

      # tools/string_state/{code}.json باید بین اجراهای بعدی (هفته‌ی بعد)
      # حفظ شود تا پچِ افزایشی درست کار کند — چون matrix jobها موازی‌اند و
      # نمی‌توانند مستقیم commit/push کنند، این را جدا آپلود می‌کنیم و در
      # جاب release یکجا commit می‌شود.
      - name: آپلود وضعیتِ رشته‌ها (برای پایداریِ پچِ افزایشی)
        uses: actions/upload-artifact@v4
        with:
          name: string-state-${{ matrix.code }}
          path: tools/string_state/${{ matrix.code }}.json
          retention-days: 3

  # ------------------------------------------------------------- release ----
  release:
    needs: [plan, build]
    # قبلا اینجا `contains(needs.build.result, 'success')` بود که با فیل‌شدن
    # حتی یک کشور در matrix، کل needs.build.result می‌شد "failure" و release
    # هیچ‌وقت اجرا نمی‌شد — حتی اگر بقیه‌ی کشورها موفق ساخته و آپلود شده بودن.
    # حالا فقط وقتی کل جاب build کنسل شده (نه فیل) یا اصلا اجرا نشده، release
    # رو رد می‌کنیم؛ در غیر این صورت با هر آرتیفکتی که موجود باشه ریلیز می‌کنیم.
    if: always() && needs.plan.outputs.count != '0' && needs.build.result != 'cancelled' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: دریافت artifact های همه‌ی کشورها
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: map-*

      - name: دریافت وضعیتِ رشته‌ها (برای commit در ریپو — پایداریِ پچِ افزایشی)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: string-state-merged
          pattern: string-state-*
          merge-multiple: true

      - name: خواندن manifest ریلیز قبلی (برای حفظ کشورهای دست‌نخورده)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p merged/prev-manifest
          if gh release download "${RELEASE_TAG}" --pattern manifest.json --dir prevdl 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          m = json.load(open("prevdl/manifest.json", encoding="utf-8"))
          os.makedirs("merged/prev-manifest", exist_ok=True)
          for c in m.get("countries", []):
              with open(f"merged/prev-manifest/manifest-{c['code']}.json", "w", encoding="utf-8") as f:
                  json.dump(c, f, ensure_ascii=False, indent=2)
          print(f"{len(m.get('countries', []))} کشور از ریلیز قبلی حفظ شد")
          PY
          else
            echo "ریلیز قبلی یافت نشد — manifest از صفر ساخته می‌شود"
          fi

      - name: ادغام manifest ها
        run: |
          mkdir -p out
          python3 tools/merge_manifests.py \
            --in-dir merged \
            --out out/manifest.json \
            --release-tag "${RELEASE_TAG}"
          find merged -type f \( -name '*.abm' -o -name '*.abm.part*' \
                                -o -name '*.abmpatch' -o -name 'patch-*.json' \) \
            -exec mv -t out/ {} +
          ls -lh out/

      - name: انتشار در ریلیز
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Abtin Maps ${{ env.RELEASE_TAG }}
          body: |
            نقشه‌های آفلاین ABTINMAP v1
            manifest: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/manifest.json
          files: out/*
          fail_on_unmatched_files: true
          make_latest: true

      - name: ثبتِ وضعیتِ رشته‌ها در ریپو (برای پچِ افزایشیِ اجرای بعدی)
        run: |
          if [ -d string-state-merged ] && [ -n "$(ls -A string-state-merged 2>/dev/null)" ]; then
            mkdir -p tools/string_state
            cp string-state-merged/*.json tools/string_state/
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tools/string_state/
            git diff --staged --quiet || (git commit -m "chore: update string_state after map build" && git push)
          else
            echo "هیچ string_state جدیدی برای commit نبود"
          fi

      - name: ثبت وضعیت ساخت در ریپو
        if: github.event_name == 'schedule'
        run: |
          cat > tools/build_state.json <<'JSON'
          ${{ needs.plan.outputs.state }}
          JSON
          python3 -c "import json;json.dump(json.load(open('tools/build_state.json')),open('tools/build_state.json','w'),ensure_ascii=False,indent=2)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/build_state.json
          git diff --staged --quiet || (git commit -m "chore: update build_state after map build" && git push)

      - name: خلاصه
        run: |
          echo "### ریلیز \`${RELEASE_TAG}\` منتشر شد" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          m=json.load(open('out/manifest.json',encoding='utf-8'))
          print('| کشور | حجم | فایل‌ها |'); print('|---|---|---|')
          for c in m['countries']:
              print(f\"| {c['name_fa']} ({c['code']}) | {c['total_size']/1e6:.0f} MB | {len(c['files'])} |\")
          " >> $GITHUB_STEP_SUMMARY
