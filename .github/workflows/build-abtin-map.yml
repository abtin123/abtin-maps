name: Build Abtin Map

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'کدهای کشور با کاما (مثلا IR,TR,IQ) یا all برای همه'
        required: false
        default: 'all'
      release_tag:
        description: 'تگ ریلیز مقصد'
        required: false
        default: 'maps-v2'
      force_rebuild:
        description: 'ساخت اجباری صرف‌نظر از تاریخ منبع (کدها با کاما یا all)'
        required: false
        default: ''
  schedule:
    # هر دوشنبه ۰۲:۰۰ UTC — فقط کشورهایی که داده‌شان تازه شده بازسازی می‌شوند
    - cron: '0 2 * * 1'

permissions:
  contents: write

concurrency:
  group: abtin-map-build
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'maps-v2' }}

jobs:
  # --------------------------------------------------------------- plan ----
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
      state: ${{ steps.changed.outputs.state }}

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # دریافت لیست فایل‌های موجود در ریلیز برای بررسی هوشمند
      - name: دریافت لیست فایل‌های ریلیز
        id: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "دریافت لیست فایل‌های ریلیز ${RELEASE_TAG}..."
          if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' > existing_assets.txt 2>/dev/null; then
             echo "لیست دریافت شد."
          else
             echo "ریلیز یافت نشد یا خالی است."
             touch existing_assets.txt
          fi
          # ذخیره محتوا در خروجی برای استفاده در پایتون
          echo "assets<<EOF" >> "$GITHUB_OUTPUT"
          cat existing_assets.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # در اجرای زمان‌بندی‌شده، فقط کشورهای دارای داده‌ی تازه انتخاب می‌شوند
      - name: بررسی به‌روزرسانی منابع Geofabrik
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 tools/check_updates.py \
              --countries tools/countries.json \
              --state tools/build_state.json \
              --force "${{ github.event.inputs.force_rebuild }}" \
              --out-changed changed.txt \
              --out-state-new state_new.json
            echo "codes=$(cat changed.txt)" >> "$GITHUB_OUTPUT"
          else
            IN="${{ github.event.inputs.countries }}"
            [ -z "$IN" ] && IN="all"
            echo "codes=$IN" >> "$GITHUB_OUTPUT"
            cp tools/build_state.json state_new.json 2>/dev/null || echo '{}' > state_new.json
          fi
          echo "state=$(python3 -c "import json,sys;print(json.dumps(json.load(open('state_new.json'))))")" >> "$GITHUB_OUTPUT"

      - name: ساخت ماتریس کشورها (با فیلتر هوشمند)
        id: build-matrix
        env:
          CODES: ${{ steps.changed.outputs.codes }}
          FORCE: ${{ github.event.inputs.force_rebuild }}
          EXISTING_ASSETS: ${{ steps.release-assets.outputs.assets }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          
          codes = (os.environ.get("CODES") or "").strip()
          force = (os.environ.get("FORCE") or "").strip()
          assets_str = os.environ.get("EXISTING_ASSETS") or ""
          existing_set = set(assets_str.splitlines())
          
          data = json.load(open("tools/countries.json", encoding="utf-8"))["countries"]
          
          # 1. انتخاب اولیه بر اساس ورودی
          if codes.lower() in ("", "all"):
              candidates = data
          else:
              want = {c.strip().upper() for c in codes.split(",") if c.strip()}
              candidates = [c for c in data if c["code"].upper() in want or
                            c.get("country_code", "").upper() in want]
              available = {c["code"].upper() for c in data} | {
                  c.get("country_code", "").upper() for c in data}
              missing = want - available
              if missing:
                  print(f"::warning::کد ناشناخته: {sorted(missing)}", file=sys.stderr)

          # 2. فیلتر هوشمند (رد کردن کشورهایی که قبلا ساخته شده‌اند)
          sel = []
          skipped = []
          
          # لیست کدهای强制 (Force)
          force_list = [f.strip().upper() for f in force.split(",")] if force else []
          force_all = "all" in force_list

          for c in candidates:
              code = c["code"].upper()
              
              # اگر Force فعال باشد (برای این کشور یا همه)، بدون شرط اضافه کن
              if force_all or code in force_list or c.get("country_code", "").upper() in force_list:
                  sel.append(c)
                  continue
              
              # اگر ورودی "all" بود، چک کن آیا فایلش در ریلیز هست؟
              # فرمت فایل‌ها: CODE.abm یا CODE.abm.part0
              has_main = f"{code}.abm" in existing_set
              has_part = any(f.startswith(f"{code}.abm.part") for f in existing_set)
              
              if codes.lower() == "all" and (has_main or has_part):
                  skipped.append(code)
              else:
                  sel.append(c)

          if skipped:
              # چاپ در stderr تا وارد GITHUB_OUTPUT نشود و ارور ندهد
              print(f"ℹ️ رد شده (قبلا ساخته شده): {', '.join(skipped)}", file=sys.stderr)

          matrix = {"include": [
              {"code": c["code"], "name_fa": c["name_fa"], 
               "name_en": c["name_en"], "pbf_url": c["pbf_url"],
               "country_code": c.get("country_code", c["code"][:2]),
               "country_name_fa": c.get("country_name_fa", c["name_fa"]),
               "country_name_en": c.get("country_name_en", c["name_en"]),
               "region_name_fa": c.get("region_name_fa", c["name_fa"]),
               "region_name_en": c.get("region_name_en", c["name_en"]),
               "group_order": c.get("group_order", 0),
               "max_zoom": c.get("render_max_zoom", 12)} for c in sel]}
               
          print("matrix=" + json.dumps(matrix, ensure_ascii=False))
          print("count=" + str(len(sel)))
          PY

      - name: خلاصه
        run: |
          echo "### 🗺️ برنامه ساخت" >> $GITHUB_STEP_SUMMARY
          echo "تعداد کشورهای انتخاب‌شده: **${{ steps.build-matrix.outputs.count }}**" >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------- build ----
  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server_map_builder/requirements-renderer.txt

      - name: نصب وابستگی‌ها
        run: |
          # سازنده فقط به بسته‌های Python نیاز دارد؛ نصب apt قبلی ممکن بود در
          # اتصال کند ده‌ها دقیقه بدون خروجی بماند و اجرای GitHub را با پیام
          # مبهم «The operation was canceled» متوقف کند. wheelهای آمادهٔ Linux
          # برای این سه وابستگی استفاده می‌شوند تا مرحله قابل‌پیش‌بینی بماند.
          timeout 5m python3 -m pip install --disable-pip-version-check --upgrade pip
          timeout 12m python3 -m pip install --disable-pip-version-check \
            --only-binary=:all: -r requirements-renderer.txt

      - name: آزادسازی فضای دیسک
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: دانلود PBF (${{ matrix.code }})
        run: |
          mkdir -p src out
          FILE="src/${{ matrix.code }}.osm.pbf"
          URL="${{ matrix.pbf_url }}"
          
          MIN_BYTES=200000
          ATTEMPT=1
          MAX_ATTEMPTS=6
          
          while :; do
            echo "تلاش دانلود $ATTEMPT/$MAX_ATTEMPTS برای ${{ matrix.code }}"
            rm -f "$FILE"
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
              -A "Mozilla/5.0 (compatible; AbtinMapBuilder/1.0)" \
              -o "$FILE" "$URL"
            
            SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            
            if [ "$SIZE" -ge "$MIN_BYTES" ] && python3 -c "import sys; f=open('$FILE','rb'); h=f.read(1); sys.exit(1 if h in (b'<', b'{') else 0)"; then
              break
            fi
            
            echo "::warning::فایل دانلودشده برای ${{ matrix.code }} مشکوک است (سایز: ${SIZE} بایت)"
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::دانلود PBF برای ${{ matrix.code }} شکست خورد"
              exit 1
            fi
            
            ATTEMPT=$((ATTEMPT+1))
            SLEEP=$(( (RANDOM % 60) + 30 * ATTEMPT ))
            echo "صبر $SLEEP ثانیه..."
            sleep "$SLEEP"
          done
          ls -lh "$FILE"

      - name: ساخت ABTINMAP
        run: |
          mkdir -p tools/string_state
          python3 tools/abtinmap_build.py "src/${{ matrix.code }}.osm.pbf" \
            -o "out/${{ matrix.code }}.abm" \
            --region "${{ matrix.code }}" \
            --profile compact \
            --building-height-mode simple \
            --tmpdir "${RUNNER_TEMP}" \
            --string-state "tools/string_state/${{ matrix.code }}.json"
          ls -lh out/

      - name: رندر کامل کاشی‌های نقشه روی سرور
        run: |
          python3 tools/rendered_tile_builder.py "src/${{ matrix.code }}.osm.pbf" \
            --code "${{ matrix.code }}" --out-dir out --min-zoom 5 --max-zoom "${{ matrix.max_zoom }}" \
            --target-mb 260 --workers 2 --webp-method 3 --max-open-tiles 256
          ls -lh "out/${{ matrix.code }}.amap" "out/rendered-${{ matrix.code }}.json"

      - name: ادغام اطلس آماده در فایل ABM همان کشور
        run: |
          python3 tools/embed_rendered_atlas.py "out/${{ matrix.code }}.abm" "out/${{ matrix.code }}.amap" --preview "out/${{ matrix.code }}.preview.webp"
          rm -f "out/${{ matrix.code }}.amap" "out/${{ matrix.code }}.preview.webp" "out/rendered-${{ matrix.code }}.json" "src/${{ matrix.code }}.osm.pbf"
          ls -lh "out/${{ matrix.code }}.abm"

      - name: اعتبارسنجی خروجی
        run: python3 tools/abtinmap_inspect.py "out/${{ matrix.code }}.abm"

      - name: دانلود نسخه‌ی قبلیِ همین کشور (برای پچ افزایشی)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download "${RELEASE_TAG}" \
            --pattern "${{ matrix.code }}.abm" --dir prev || true
          ls -lh prev/ 2>/dev/null || true

      - name: ساخت پچِ افزایشی
        if: hashFiles(format('prev/{0}.abm', matrix.code)) != ''
        continue-on-error: true
        run: |
          python3 tools/abtinmap_diff.py \
            "prev/${{ matrix.code }}.abm" "out/${{ matrix.code }}.abm" \
            --code "${{ matrix.code }}" --out-dir out
          rm -rf prev
          ls -lh "out/${{ matrix.code }}.abmpatch" "out/patch-${{ matrix.code }}.json" 2>/dev/null || true

      - name: ساخت manifest تک‌کشوره + تکه‌کردن فایل
        run: |
          PATCH_ARG=""
          if [ -f "out/patch-${{ matrix.code }}.json" ]; then
            PATCH_ARG="--patch-json out/patch-${{ matrix.code }}.json"
          fi
          
          python3 tools/make_manifest.py "out/${{ matrix.code }}.abm" \
            --code "${{ matrix.code }}" \
            --name-fa "${{ matrix.name_fa }}" \
            --name-en "${{ matrix.name_en }}" \
            --country-code "${{ matrix.country_code }}" \
            --country-name-fa "${{ matrix.country_name_fa }}" \
            --country-name-en "${{ matrix.country_name_en }}" \
            --region-name-fa "${{ matrix.region_name_fa }}" \
            --region-name-en "${{ matrix.region_name_en }}" \
            --group-order "${{ matrix.group_order }}" \
            --out-dir out \
            --release-tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            $PATCH_ARG
            
          if ls out/${{ matrix.code }}.abm.part0 >/dev/null 2>&1; then
            rm -f "out/${{ matrix.code }}.abm"
          fi
          ls -lh out/

      - name: آپلود artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.code }}
          path: out/*
          retention-days: 3
          compression-level: 0

      - name: آپلود وضعیتِ رشته‌ها
        uses: actions/upload-artifact@v4
        with:
          name: string-state-${{ matrix.code }}
          path: tools/string_state/${{ matrix.code }}.json
          retention-days: 3

  # ------------------------------------------------------------ release ----
  release:
    needs: [plan, build]
    if: always() && needs.plan.outputs.count != '0' && needs.build.result != 'cancelled' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: دریافت artifact های همه‌ی کشورها
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: map-*

      - name: دریافت وضعیتِ رشته‌ها
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: string-state-merged
          pattern: string-state-*
          merge-multiple: true

      - name: خواندن manifest ریلیز قبلی
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p merged/prev-manifest
          if gh release download "${RELEASE_TAG}" --pattern manifest.json --dir prevdl 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          m = json.load(open("prevdl/manifest.json", encoding="utf-8"))
          os.makedirs("merged/prev-manifest", exist_ok=True)
          for c in m.get("countries", []):
              with open(f"merged/prev-manifest/manifest-{c['code']}.json", "w", encoding="utf-8") as f:
                  json.dump(c, f, ensure_ascii=False, indent=2)
          print(f"{len(m.get('countries', []))} کشور از ریلیز قبلی حفظ شد")
          PY
          else
            echo "ریلیز قبلی یافت نشد — manifest از صفر ساخته می‌شود"
          fi

      - name: ادغام manifest ها
        run: |
          mkdir -p out
          python3 tools/merge_manifests.py \
            --in-dir merged \
            --out out/manifest.json \
            --release-tag "${RELEASE_TAG}"
            
          find merged -type f \( -name '*.abm' -o -name '*.abm.part*' \
                                -o -name '*.abmpatch' -o -name 'patch-*.json' \) \
            -exec mv -t out/ {} +
          ls -lh out/

      - name: انتشار در ریلیز
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Abtin Maps ${{ env.RELEASE_TAG }}
          body: |
            نقشه‌های آفلاین ABTINMAP v1
            manifest: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/manifest.json
          files: out/*
          fail_on_unmatched_files: true
          make_latest: true

      - name: ثبتِ وضعیتِ رشته‌ها در ریپو
        run: |
          if [ -d string-state-merged ] && [ -n "$(ls -A string-state-merged 2>/dev/null)" ]; then
            mkdir -p tools/string_state
            cp string-state-merged/*.json tools/string_state/
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tools/string_state/
            git diff --staged --quiet || (git commit -m "chore: update string_state after map build" && git push)
          else
            echo "هیچ string_state جدیدی برای commit نبود"
          fi

      - name: ثبت وضعیت ساخت در ریپو
        if: github.event_name == 'schedule'
        run: |
          cat > tools/build_state.json <<'JSON'
          ${{ needs.plan.outputs.state }}
          JSON
          python3 -c "import json;json.dump(json.load(open('tools/build_state.json')),open('tools/build_state.json','w'),ensure_ascii=False,indent=2)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/build_state.json
          git diff --staged --quiet || (git commit -m "chore: update build_state after map build" && git push)

      - name: خلاصه
        run: |
          echo "### ✅ ریلیز \`${RELEASE_TAG}\` منتشر شد" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          m=json.load(open('out/manifest.json',encoding='utf-8'))
          print('| کشور | حجم | فایل‌ها |'); print('|---|---|---|')
          for c in m['countries']:
              print(f\"| {c['name_fa']} ({c['code']}) | {c['total_size']/1e6:.0f} MB | {len(c['files'])} |\")
          " >> $GITHUB_STEP_SUMMARY
