name: Queue global OSM map updates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'initial: فقط کشورِ نساخته؛ weekly: کشور نساخته + OSM تغییرکرده'
        required: true
        default: 'initial'
        type: choice
        options:
          - initial
          - weekly
      release_tag:
        description: 'Release نهایی موجود که باید فقط update شود'
        required: true
        default: 'maps-v3'
      recover_active:
        description: 'batch فعال صف موجود را دوباره شروع کن؛ state پاک یا دوباره ساخته نمی‌شود'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: write
  actions: write

concurrency:
  group: abtin-map-queue-planner
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || 'maps-v3' }}
  RUN_MODE: ${{ github.event_name == 'schedule' && 'weekly' || inputs.mode }}
  RECOVER_ACTIVE: ${{ inputs.recover_active || 'false' }}

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: توقف امن اگر صف قبلی هنوز فعال است
        id: existing
        run: |
          output="$(python3 tools/map_build_queue.py --emit-active)"
          echo "${output}"
          echo "${output}" >> "$GITHUB_OUTPUT"

      - name: دریافت manifest نهایی موجود
        if: steps.existing.outputs.has_active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release download "${RELEASE_TAG}" --pattern manifest.json --dir previous
          else
            printf '%s\n' '{"schema":1,"countries":[]}' > previous/manifest.json
          fi

      - name: تشخیص کشور جدید یا منبع OSM تغییرکرده
        if: steps.existing.outputs.has_active != 'true'
        run: |
          set -euo pipefail
          python3 tools/plan_osm_updates.py \
            --manifest previous/manifest.json \
            --state tools/osm_source_state.json \
            --out-missing-batches /tmp/missing-batches.txt \
            --out-changed-batches /tmp/changed-batches.txt \
            --out-state /tmp/osm_source_state.json \
            --batch-size 15
          if [ "${RUN_MODE}" = 'initial' ]; then
            cp /tmp/missing-batches.txt /tmp/selected-batches.txt
          else
            cat /tmp/missing-batches.txt /tmp/changed-batches.txt > /tmp/selected-batches.txt
          fi
          echo '--- batchهای انتخاب‌شده ---'
          cat /tmp/selected-batches.txt || true

      - name: ایجاد صف جهانی و ثبت state
        if: steps.existing.outputs.has_active != 'true'
        id: new_queue
        run: |
          set -euo pipefail
          output="$(python3 tools/map_build_queue.py \
            --init \
            --mode "${RUN_MODE}" \
            --release-tag "${RELEASE_TAG}" \
            --batch-file /tmp/selected-batches.txt)"
          echo "${output}"
          echo "${output}" >> "$GITHUB_OUTPUT"
          cp tools/map_build_queue.json /tmp/map_build_queue.json
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/osm_source_state.json tools/osm_source_state.json
            cp /tmp/map_build_queue.json tools/map_build_queue.json
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add tools/osm_source_state.json tools/map_build_queue.json
            if git diff --staged --quiet; then
              break
            fi
            git commit -m "chore: queue ${RUN_MODE} OSM map updates"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            sleep "${attempt}"
          done

      - name: شروع batch جدید یا بازیابی batch فعال
        if: steps.new_queue.outputs.has_active == 'true' || (steps.existing.outputs.has_active == 'true' && env.RECOVER_ACTIVE == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="$(python3 tools/map_build_queue.py --emit-active)"
          echo "${output}"
          test "$(sed -n 's/^has_active=//p' <<<"${output}")" = 'true'
          countries="$(sed -n 's/^countries=//p' <<<"${output}")"
          queue_id="$(sed -n 's/^queue_id=//p' <<<"${output}")"
          payload="$(jq -nc \
            --arg ref "${GITHUB_REF_NAME}" \
            --arg countries "${countries}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg queue_id "${queue_id}" \
            '{ref:$ref,inputs:{countries:$countries,release_tag:$release_tag,queue_id:$queue_id}}')"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-abtin-map.yml/dispatches" \
            --data "${payload}"

      - name: خلاصه
        run: |
          echo "### صف نقشهٔ OSM" >> "$GITHUB_STEP_SUMMARY"
          echo "mode: **${RUN_MODE}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.existing.outputs.has_active }}" = 'true' ] && [ "${RECOVER_ACTIVE}" = 'true' ]; then
            echo 'batch فعال صف موجود دوباره شروع شد؛ state حفظ شده است.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.existing.outputs.has_active }}" = 'true' ]; then
            echo 'یک صف قبلی فعال بود؛ state حفظ شد و build جدید شروع نشد.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.new_queue.outputs.has_active }}" = 'true' ]; then
            echo "اولین batch: \`${{ steps.new_queue.outputs.countries }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'کشور جدید یا منبع تغییرکرده‌ای برای ساخت وجود نداشت.' >> "$GITHUB_STEP_SUMMARY"
          fi
