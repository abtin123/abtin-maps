---
name: Build offline country map

'on':
  workflow_dispatch:
    inputs:
      country_code:
        description: 'Country code, for example IR'
        required: true
        default: 'IR'
        type: string
      pbf_url:
        description: 'Direct .osm.pbf URL (or a repository-relative PBF path)'
        required: true
        default: 'https://download.geofabrik.de/asia/iran-latest.osm.pbf'
        type: string
      name_fa:
        description: 'Persian country name for the app catalog'
        required: true
        default: 'ایران'
        type: string
      name_en:
        description: 'English country name for the app catalog'
        required: true
        default: 'Iran'
        type: string
      bbox:
        description: 'minLon,minLat,maxLon,maxLat'
        required: true
        default: '44.0,25.0,64.5,40.5'
        type: string
      release_tag:
        description: 'Release tag holding map assets'
        required: true
        default: 'maps-v3'
        type: string

permissions:
  contents: write

concurrency:
  group: offline-map-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build ${{ inputs.country_code }} as one ABM container
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      CODE: ${{ inputs.country_code }}
      PBF_URL: ${{ inputs.pbf_url }}
      NAME_FA: ${{ inputs.name_fa }}
      NAME_EN: ${{ inputs.name_en }}
      BBOX: ${{ inputs.bbox }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout map builder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graph and official PMTiles tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install osmium zstandard brotli
          PMTILES_URL='https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz'
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 600 \
            "$PMTILES_URL" -o /tmp/go-pmtiles.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/go-pmtiles.tar.gz -C /tmp
          install -m 755 /tmp/pmtiles "$HOME/.local/bin/pmtiles"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pmtiles" version

      - name: Build one container
        run: |
          mkdir -p dist
          chmod +x tool/maps/build_country_abm.sh
          tool/maps/build_country_abm.sh "$CODE" "$PBF_URL" dist
          test -f "dist/${CODE^^}.abm"
          pmtiles verify "dist/${CODE^^}.abm"

      - name: Fetch the previous release manifest when available
        run: |
          mkdir -p previous
          gh release download "$RELEASE_TAG" \
            --pattern manifest.json --dir previous || true

      - name: Create or update the app catalog manifest
        run: |
          CODE_UPPER="${CODE^^}"
          PREVIOUS=()
          if [ -f previous/manifest.json ]; then
            PREVIOUS=(--previous previous/manifest.json)
          fi
          python tool/maps/update_map_manifest.py \
            --output dist/manifest.json \
            "${PREVIOUS[@]}" \
            --release-tag "$RELEASE_TAG" \
            --archive "dist/${CODE_UPPER}.abm" \
            --code "$CODE_UPPER" \
            --name-fa "$NAME_FA" \
            --name-en "$NAME_EN" \
            --bbox "$BBOX" \
            --source-url "$PBF_URL"
          python -m json.tool dist/manifest.json >/dev/null

      - name: Publish one ABM archive and manifest directly to Release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Offline Maps" \
              --notes "Offline country map containers."
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/${CODE^^}.abm" dist/manifest.json --clobber
